name: Security - supply chain

# Daily sweep of every repository in the the-wolfpack-agency org:
#   - open Dependabot alerts (malware, critical, high listed)
#   - every lockfile package@version against OSV, including MAL- malicious-package records
#   - security/known-compromised.json (this week's litellm, @subql/common, tensorlake,
#     fake Apex Accelerator packages, and the litellm container images)
#   - GhostAction: workflow files changed in the last 14 days outside a merged PR
#
# Read-only. Logic and rules: scripts/security/supply-chain.ts and lib/supply-chain.ts.
#
# DARK UNTIL CONFIGURED. github.token can only see this repository, so the sweep
# needs SECURITY_AUDIT_GH_TOKEN: a read-only fine-grained token (or GitHub App
# token) for all org repositories. Setup: docs/security/scheduled-checks.md.
# Without it the job writes SKIPPED to the run summary and exits green.

on:
  schedule:
    - cron: "17 11 * * *" # daily 11:17 UTC
  workflow_dispatch:
    inputs:
      fail_on:
        description: "Lowest severity that fails the run (critical, high, medium, low)"
        required: false
        default: "medium"

permissions:
  contents: read

concurrency:
  group: security-supply-chain
  cancel-in-progress: false

jobs:
  sweep:
    runs-on: ubuntu-latest
    # ~15 repositories, a few hundred read calls, one OSV batch per 1000 packages.
    timeout-minutes: 30
    env:
      HAS_TOKEN: ${{ secrets.SECURITY_AUDIT_GH_TOKEN != '' }}
    steps:
      - name: Skip until SECURITY_AUDIT_GH_TOKEN is configured
        if: env.HAS_TOKEN != 'true'
        run: |
          {
            echo "## Security check: supply-chain"
            echo ""
            echo "**SKIPPED.** Add the repository secret SECURITY_AUDIT_GH_TOKEN (read-only: Contents, Metadata, Pull requests, Dependabot alerts on all org repositories). Steps: docs/security/scheduled-checks.md"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::notice::security:supply-chain skipped: SECURITY_AUDIT_GH_TOKEN is not configured."

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        if: env.HAS_TOKEN == 'true'

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v4.0.4
        if: env.HAS_TOKEN == 'true'
        with:
          node-version: 20

      - name: Run security:supply-chain
        if: env.HAS_TOKEN == 'true'
        env:
          SECURITY_REPORT_PUBLIC: ${{ github.event.repository.private && 'false' || 'true' }}
          GH_TOKEN: ${{ secrets.SECURITY_AUDIT_GH_TOKEN }}
          FAIL_ON: ${{ inputs.fail_on || 'medium' }}
          npm_config_yes: "true"
        run: npm run security:supply-chain -- --out security-reports --fail-on "$FAIL_ON"

      - name: Keep the report
        continue-on-error: true
        if: always() && env.HAS_TOKEN == 'true' && github.event.repository.private
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: security-supply-chain-${{ github.run_id }}
          path: security-reports/
          retention-days: 90
          if-no-files-found: ignore
