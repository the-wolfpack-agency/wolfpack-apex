name: "E2E: Forcefield Web (live UI)"

# Drives the REAL Forcefield Web UI at /admin/site-analytics against the DEPLOYED
# app, as a client does: loads the board, reads usage, switches to agent defense,
# sees operators OR an honest empty state, opens the severity triage view, and
# filters by property - asserting 200 (never a blank 401), no CSP/console/network
# failures, and that every surface renders real content or an explicit empty state.
#
# No model spend (pure page reads), so it is light. Runs on demand, daily, and on
# any PR that touches the surface, so a change re-runs the E2E. Needs PROD_URL +
# SMOKE_TEST_EMAIL + SMOKE_TEST_PASSWORD (already in repo secrets); skips the signed
# -in journeys loudly in CI if a credential is missing (the spec fails rather than
# skip-green). If PROD_URL is unset the job SKIPS loudly.

on:
  workflow_dispatch:
  schedule:
    - cron: "41 13 * * *" # daily ~13:41 UTC
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "tests/e2e/site-analytics-agent-profile.spec.ts"
      - "tests/e2e/site-analytics-defense.spec.ts"
      - "tests/e2e/site-analytics-proven.spec.ts"
      - "tests/e2e/site-analytics-accountable.spec.ts"
      - "tests/e2e/evidence-backed-status.spec.ts"
      - "tests/e2e/forcefield-threat-coverage.spec.ts"
      - "tests/e2e/forcefield-exposure.spec.ts"
      - "src/app/(dashboard)/admin/forcefield/page.tsx"
      - "src/app/api/admin/forcefield/exposure/**"
      - "src/components/forcefield/ExposurePanel.tsx"
      - ".github/workflows/forcefield-web-dogfood.yml"
      - "src/app/(dashboard)/admin/site-analytics/**"
      - "src/app/api/admin/site-analytics/**"
      - "src/app/api/site-analytics/**"
      - "src/lib/site-analytics.ts"
      - "src/lib/site-analytics-proven.ts"
      - "src/lib/site-analytics-accountability.ts"
      - "src/components/site-analytics/**"
      - "src/lib/agent-operators.ts"
      - "src/lib/agent-profile.ts"
      - "src/lib/agent-behavior.ts"
      # Evidence-backed status surfaces (assurance panel, gate regression set,
      # security posture, trust center) and the evidence they are computed from.
      - "src/components/forcefield/ForcefieldAssurance.tsx"
      - "src/app/api/admin/forcefield/assurance/**"
      - "src/lib/forcefield/assurance*.ts"
      - "src/lib/compliance/**"
      - "src/lib/ai-redteam/**"
      - "src/app/(dashboard)/admin/ai-redteam/**"
      - "src/app/api/admin/ai-redteam/**"
      - "src/app/(dashboard)/admin/trust-center/**"
      - "src/app/security-posture/**"
      - "src/app/api/admin/security-posture/**"
      - "docs/security-posture.md"
      # Threat-coverage panel (/admin/forcefield): the matrix is computed by
      # running samples through the engine, so an engine change re-runs it.
      - "src/app/(dashboard)/admin/forcefield/**"
      - "src/lib/forcefield/threat-coverage.ts"
      - "src/lib/forcefield-web/observe.ts"
      - "src/lib/forcefield-web/hosting.ts"
      - "src/lib/forcefield-web/enforce.ts"
      - "src/lib/forcefield-web/ruleset.ts"

permissions:
  contents: read

concurrency:
  group: forcefield-web-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: E2E (live UI)
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI: "true"
      PROD_URL: ${{ secrets.PROD_URL }}
      SMOKE_TEST_EMAIL: ${{ secrets.SMOKE_TEST_EMAIL }}
      SMOKE_TEST_PASSWORD: ${{ secrets.SMOKE_TEST_PASSWORD }}

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Require PROD_URL (the E2E targets the live deployment)
        id: cfg
        run: |
          if [ -z "${PROD_URL}" ]; then
            echo "configured=false" >> $GITHUB_OUTPUT
            echo "::warning::PROD_URL secret not set - Forcefield Web E2E SKIPPED. It must target the deployed app. Add PROD_URL + SMOKE_TEST_EMAIL + SMOKE_TEST_PASSWORD in Settings -> Secrets -> Actions."
          else
            echo "configured=true" >> $GITHUB_OUTPUT
          fi

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v4.0.4
        if: steps.cfg.outputs.configured == 'true'
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        if: steps.cfg.outputs.configured == 'true'
        run: npm ci

      - name: Cache Playwright browsers
        if: steps.cfg.outputs.configured == 'true'
        id: pw-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright browser
        if: steps.cfg.outputs.configured == 'true' && steps.pw-cache.outputs.cache-hit != 'true'
        timeout-minutes: 8
        run: npx playwright install chromium

      - name: Install OS libraries for Chromium
        if: steps.cfg.outputs.configured == 'true'
        timeout-minutes: 6
        # Best-effort: a hanging apt mirror must NEVER fail the job (mirrors the
        # other live-UI E2E workflows). A genuinely missing library surfaces as a
        # browser-launch failure in the next step.
        continue-on-error: true
        run: |
          timeout 150 npx playwright install-deps chromium \
            || (echo "retrying once" && sleep 10 && timeout 150 npx playwright install-deps chromium) \
            || echo "::warning::playwright install-deps failed (apt mirror). Continuing: a missing library surfaces as a browser launch failure next."

      - name: Run the Forcefield Web E2E through the live UI
        if: steps.cfg.outputs.configured == 'true'
        run: >-
          npx playwright test
          tests/e2e/site-analytics-agent-profile.spec.ts
          ${{ github.event_name != 'pull_request' && 'tests/e2e/site-analytics-defense.spec.ts' || '' }}
          ${{ github.event_name != 'pull_request' && 'tests/e2e/site-analytics-proven.spec.ts' || '' }}
          ${{ github.event_name != 'pull_request' && 'tests/e2e/site-analytics-accountable.spec.ts' || '' }}
          ${{ github.event_name != 'pull_request' && 'tests/e2e/evidence-backed-status.spec.ts' || '' }}
          ${{ github.event_name != 'pull_request' && 'tests/e2e/forcefield-threat-coverage.spec.ts' || '' }}
          ${{ github.event_name != 'pull_request' && 'tests/e2e/forcefield-exposure.spec.ts' || '' }}
          --config=playwright.config.ts
          --reporter=github

      - name: Upload Playwright report
        if: (always()) && github.event.repository.private
        continue-on-error: true # diagnostic upload must not fail the job
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: forcefield-web-e2e-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
          if-no-files-found: ignore

  # The defense panel spec stubs the session and board data, so it needs the PR's
  # OWN build, not production: before merge, production does not have the panel
  # yet and the spec could only ever fail there. This job builds the PR and serves
  # it locally (no database, no secrets); the live job above runs the same spec
  # against production on the daily schedule and on demand.
  defense-pr:
    name: E2E (defense panel, PR build)
    if: github.event_name == 'pull_request' && github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CI: "true"
      PROD_URL: http://localhost:3217
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v4.0.4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright browser
        if: steps.pw-cache.outputs.cache-hit != 'true'
        timeout-minutes: 8
        run: npx playwright install chromium

      - name: Install OS libraries for Chromium
        timeout-minutes: 6
        continue-on-error: true
        run: |
          timeout 150 npx playwright install-deps chromium \
            || echo "::warning::playwright install-deps failed (apt mirror). A missing library surfaces as a browser launch failure next."

      - name: Build and serve the PR
        timeout-minutes: 15
        run: |
          # A throwaway per-run signing secret: the spec stubs the session, nothing
          # here verifies a real token, and no database is configured.
          export INSTINCT_JWT_SECRET="$(openssl rand -hex 32)"
          npx next build
          nohup npx next start -p 3217 > next-start.log 2>&1 &
          for i in $(seq 1 60); do curl -sf -o /dev/null http://localhost:3217/login && exit 0; sleep 2; done
          echo "::error::next start did not answer on :3217"; tail -50 next-start.log; exit 1

      - name: Run the defense panel E2E against the PR build
        # The live layer needs a real sign-in against production; it runs in the
        # live job above on schedule / on demand, so only the deterministic layer
        # (stubbed session + fixed data, every state) runs against the PR build.
        run: >-
          npx playwright test
          tests/e2e/site-analytics-defense.spec.ts
          tests/e2e/site-analytics-proven.spec.ts
          tests/e2e/site-analytics-accountable.spec.ts
          tests/e2e/evidence-backed-status.spec.ts
          tests/e2e/forcefield-threat-coverage.spec.ts
          tests/e2e/forcefield-exposure.spec.ts
          --grep-invert "real sign-in"
          --config=playwright.config.ts
          --reporter=github
