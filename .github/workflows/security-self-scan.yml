name: AgenticQA Security Self-Scan

on:
  push:
    branches: [main]
    paths: ['src/**']
  pull_request:
    branches: [main]
  schedule:
    # Weekly: Sunday 2 AM UTC
    - cron: '0 2 * * 0'
  workflow_dispatch:
    inputs:
      scan_phase:
        description: 'Which phases to run'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - scan
          - pentest
          - dependency
      fail_on_critical:
        description: 'Fail if critical findings'
        required: false
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: security-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ──────────────────────────────────────────────────
  # Job 1: Static Security Scan (AgenticQA scanners)
  # ──────────────────────────────────────────────────
  static-scan:
    if: >-
      github.event_name != 'workflow_dispatch' ||
      inputs.scan_phase == 'all' ||
      inputs.scan_phase == 'scan'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    name: "Static Security Scan"
    # Read-only. This job used to hold contents: write so it could commit a
    # regenerated baseline to main on every push, which absorbed every new
    # finding the moment it landed and kept the gate from ever going red. The
    # baseline now changes only through a reviewed commit
    # (scripts/security/self-scan.ts baseline, docs/security/self-scan.md).
    permissions:
      contents: read
    # Numbers only. These outputs feed the scan-summary job, whose summary,
    # PR comment and issue are public in this repository.
    outputs:
      total_findings: ${{ steps.gate.outputs.total_findings }}
      total_critical: ${{ steps.gate.outputs.total_critical }}
      risk_level: ${{ steps.gate.outputs.risk_level }}
      new_findings: ${{ steps.gate.outputs.new_findings }}
      new_critical_high: ${{ steps.gate.outputs.new_critical_high }}
      scanner_errors: ${{ steps.gate.outputs.scanner_errors }}
    steps:
      - name: Checkout Instinct
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Check if PAT is configured
        id: pat-check
        env:
          PAT: ${{ secrets.AGENTICQA_REPO_PAT }}
        run: |
          if [ -z "${PAT}" ]; then
            echo "configured=false" >> $GITHUB_OUTPUT
            echo "::warning::AGENTICQA_REPO_PAT secret not set, static scan will skip. Add it in Settings -> Secrets -> Actions."
          else
            echo "configured=true" >> $GITHUB_OUTPUT
          fi

      - name: Checkout AgenticQA
        if: steps.pat-check.outputs.configured == 'true'
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: nhomyk/AgenticQA
          token: ${{ secrets.AGENTICQA_REPO_PAT }}
          # Vendored under vendor/ so the scanner's SKIP_DIRS excludes
          # it, run_client_scan scans only Instinct, not the tool's
          # own intentionally-vulnerable fixtures.
          path: vendor/agenticqa-tool
          ref: main
          fetch-depth: 1

      - name: Set up Python 3.13
        if: steps.pat-check.outputs.configured == 'true'
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: vendor/agenticqa-tool/AgenticQA/pyproject.toml

      - name: Install AgenticQA
        if: steps.pat-check.outputs.configured == 'true'
        run: |
          # Pinned: an unpinned `--upgrade pip` means the toolchain that
          # installs our scanner is whatever shipped that morning, which is the
          # one dependency a security workflow should not be casual about.
          # Bump deliberately, the same way any other dependency moves.
          python -m pip install --upgrade "pip==26.2"
          pip install -e ./vendor/agenticqa-tool/AgenticQA/

      - name: Run security scan
        if: steps.pat-check.outputs.configured == 'true'
        run: |
          # No --json: with it the scanner prints every finding (file, line,
          # rule, evidence) to stdout, and this repository's logs are public.
          # Results go to the file only; console output is discarded and
          # stderr is shown only if the scanner itself fails.
          set +e
          python vendor/agenticqa-tool/AgenticQA/scripts/run_client_scan.py . \
            --output scan-results.json > /dev/null 2> scan-stderr.log
          code=$?
          set -e
          if [ "$code" -ne 0 ] || [ ! -s scan-results.json ]; then
            echo "::error::run_client_scan.py exited $code without a result file"
            tail -n 30 scan-stderr.log
            exit 2
          fi
          echo "--- Scan complete ---"

      - name: Set up Node.js
        if: steps.pat-check.outputs.configured == 'true'
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v4.0.4
        with:
          node-version: '22'

      - name: Gate on the committed baseline
        id: gate
        if: steps.pat-check.outputs.configured == 'true'
        env:
          # Fail closed: details only when the repository says it is private.
          SECURITY_REPORT_PUBLIC: ${{ github.event.repository.private && 'false' || 'true' }}
          npm_config_yes: "true"
        run: npx tsx scripts/security/self-scan.ts static --scan scan-results.json --baseline .agenticqa/scan-baseline.json --md scan-report.md

      - name: Upload scan results
        # Private repositories only: an artifact here is downloadable by anyone.
        if: steps.pat-check.outputs.configured == 'true' && github.event.repository.private
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        continue-on-error: true # diagnostic upload; a transient artifact-service timeout must not fail the job
        with:
          name: scan-results
          path: scan-results.json
          retention-days: 30

      - name: Fail on NEW critical/high findings or a silent scanner
        if: >-
          steps.pat-check.outputs.configured == 'true' &&
          (github.event_name != 'workflow_dispatch' || inputs.fail_on_critical == true) &&
          (steps.gate.outputs.new_critical_high != '0' || steps.gate.outputs.scanner_errors != '0')
        env:
          NEW_CRITICAL_HIGH: ${{ steps.gate.outputs.new_critical_high }}
          SCANNER_ERRORS: ${{ steps.gate.outputs.scanner_errors }}
        run: |
          echo "::error::$NEW_CRITICAL_HIGH new critical/high finding(s) not in .agenticqa/scan-baseline.json; $SCANNER_ERRORS key scanner(s) did not report."
          echo "Fix them, or accept them with a reviewed baseline commit: docs/security/self-scan.md."
          echo "The baseline no longer updates itself, so this stays red until one of those happens."
          exit 1

      - name: Skip notice
        if: steps.pat-check.outputs.configured != 'true'
        run: |
          echo "## Static Scan: Skipped" >> $GITHUB_STEP_SUMMARY
          echo "AGENTICQA_REPO_PAT secret is not configured." >> $GITHUB_STEP_SUMMARY
          echo "Add a PAT with \`repo\` scope to enable scanning." >> $GITHUB_STEP_SUMMARY

  # ──────────────────────────────────────────────────
  # Job 2: Pentest Validation
  # ──────────────────────────────────────────────────
  pentest-validation:
    needs: [static-scan]
    if: >-
      always() &&
      needs.static-scan.result != 'cancelled' &&
      (github.event_name != 'workflow_dispatch' ||
       inputs.scan_phase == 'all' ||
       inputs.scan_phase == 'pentest')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    name: "Pentest Validation"
    outputs:
      pentest_ran: ${{ steps.gate.outputs.pentest_ran }}
      pentest_confirmed: ${{ steps.gate.outputs.pentest_confirmed }}
      pentest_confirmed_critical_high: ${{ steps.gate.outputs.pentest_confirmed_critical_high }}
    steps:
      - name: Checkout Instinct
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Check if PAT is configured
        id: pat-check
        env:
          PAT: ${{ secrets.AGENTICQA_REPO_PAT }}
        run: |
          if [ -z "${PAT}" ]; then
            echo "configured=false" >> $GITHUB_OUTPUT
            echo "::warning::AGENTICQA_REPO_PAT secret not set, pentest validation will skip."
          else
            echo "configured=true" >> $GITHUB_OUTPUT
          fi

      - name: Checkout AgenticQA
        if: steps.pat-check.outputs.configured == 'true'
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: nhomyk/AgenticQA
          token: ${{ secrets.AGENTICQA_REPO_PAT }}
          # Vendored under vendor/ so the scanner's SKIP_DIRS excludes
          # it, run_client_scan scans only Instinct, not the tool's
          # own intentionally-vulnerable fixtures.
          path: vendor/agenticqa-tool
          ref: main
          fetch-depth: 1

      - name: Set up Python 3.13
        if: steps.pat-check.outputs.configured == 'true'
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: vendor/agenticqa-tool/AgenticQA/pyproject.toml

      - name: Install AgenticQA
        if: steps.pat-check.outputs.configured == 'true'
        run: |
          # Pinned: an unpinned `--upgrade pip` means the toolchain that
          # installs our scanner is whatever shipped that morning, which is the
          # one dependency a security workflow should not be casual about.
          # Bump deliberately, the same way any other dependency moves.
          python -m pip install --upgrade "pip==26.2"
          pip install -e ./vendor/agenticqa-tool/AgenticQA/

      - name: Run pentest validation
        if: steps.pat-check.outputs.configured == 'true'
        run: |
          # --json would print the full report, every candidate finding with
          # its file and evidence, into this public log. File only.
          set +e
          python vendor/agenticqa-tool/AgenticQA/scripts/self_hack.py . \
            --phase pentest \
            --output pentest-results.json > /dev/null 2> pentest-stderr.log
          code=$?
          set -e
          if [ "$code" -ne 0 ] || [ ! -s pentest-results.json ]; then
            echo "::error::self_hack.py exited $code without a result file"
            tail -n 30 pentest-stderr.log
            exit 2
          fi

      - name: Set up Node.js
        if: steps.pat-check.outputs.configured == 'true'
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v4.0.4
        with:
          node-version: '22'

      - name: Read the pentest result
        id: gate
        if: steps.pat-check.outputs.configured == 'true'
        env:
          npm_config_yes: "true"
        run: npx tsx scripts/security/self-scan.ts pentest --results pentest-results.json --md pentest-report.md

      - name: Upload pentest results
        # Private repositories only: an artifact here is downloadable by anyone.
        if: steps.pat-check.outputs.configured == 'true' && github.event.repository.private
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        continue-on-error: true # diagnostic upload; a transient artifact-service timeout must not fail the job
        with:
          name: pentest-results
          path: pentest-results.json
          retention-days: 30

      - name: Fail on confirmed critical/high, or a pentest that did not run
        # The previous check read summary.total_critical, a key self_hack.py
        # does not write, so it reported 0 on every run whatever it found.
        if: >-
          steps.pat-check.outputs.configured == 'true' &&
          (steps.gate.outputs.pentest_ran != 'true' || steps.gate.outputs.pentest_confirmed_critical_high != '0')
        env:
          RAN: ${{ steps.gate.outputs.pentest_ran }}
          CONFIRMED: ${{ steps.gate.outputs.pentest_confirmed_critical_high }}
        run: |
          if [ "$RAN" != "true" ]; then
            echo "::error::The pentest phase did not run (no phase 2 result). A pentest that did not run is not a pass."
          else
            echo "::error::Confirmed critical/high vulnerabilities: $CONFIRMED"
          fi
          exit 1

  # ──────────────────────────────────────────────────
  # Job 3: Dependency Audit
  # ──────────────────────────────────────────────────
  dependency-audit:
    if: >-
      github.event_name != 'workflow_dispatch' ||
      inputs.scan_phase == 'all' ||
      inputs.scan_phase == 'dependency'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    name: "Dependency Audit"
    outputs:
      high_count: ${{ steps.parse.outputs.high_count }}
      critical_count: ${{ steps.parse.outputs.critical_count }}
    steps:
      - name: Checkout Instinct
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v4.0.4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Run npm audit
        id: audit
        run: |
          # Audit production dependencies only. Dev-only build tooling
          # (eslint, jest and their transitive glob/brace-expansion) never
          # ships to production, and Dependabot already covers every
          # dependency on the repo security page. This mirrors the prod-only
          # audit in agenticqa-full-pipeline.yml.
          npm audit --omit=dev --json > npm-audit.json 2> npm-audit-stderr.log || true
          echo "--- npm audit complete ---"

      - name: Parse audit results
        id: parse
        run: |
          python3 << 'PYEOF'
          import json, os, sys

          # Fail closed: an audit that could not run (registry down, bad
          # output) used to write 0 high / 0 critical and pass.
          try:
              with open("npm-audit.json") as f:
                  data = json.load(f)
              vulns = data["metadata"]["vulnerabilities"]
          except (json.JSONDecodeError, FileNotFoundError, KeyError, TypeError):
              print("::error::npm audit produced no vulnerability counts; the audit did not run")
              sys.exit(2)

          high = int(vulns.get("high", 0))
          critical = int(vulns.get("critical", 0))

          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write(f"high_count={high}\n")
              out.write(f"critical_count={critical}\n")

          print(f"Dependency audit: {high} high, {critical} critical")
          PYEOF

      - name: Upload audit results
        # Private repositories only: an artifact here is downloadable by anyone.
        if: github.event.repository.private
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        continue-on-error: true # diagnostic upload; a transient artifact-service timeout must not fail the job
        with:
          name: npm-audit
          path: npm-audit.json
          retention-days: 30

      - name: Fail on high/critical CVEs
        if: >-
          (github.event_name != 'workflow_dispatch' || inputs.fail_on_critical == true) &&
          (steps.parse.outputs.high_count != '0' || steps.parse.outputs.critical_count != '0')
        env:
          HIGH: ${{ steps.parse.outputs.high_count }}
          CRITICAL: ${{ steps.parse.outputs.critical_count }}
        run: |
          echo "::error::npm audit found $HIGH high and $CRITICAL critical CVEs"
          exit 1

  # ──────────────────────────────────────────────────
  # Job 4: Scan Summary
  # ──────────────────────────────────────────────────
  # Built from the jobs' outputs, which are counts only. It downloads no
  # artifacts: the result files are uploaded only from a private repository,
  # and their contents never belong in this public summary, comment or issue.
  scan-summary:
    needs: [static-scan, pentest-validation, dependency-audit]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    name: "Scan Summary"
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v4.0.4
        with:
          node-version: '22'

      - name: Generate combined report
        env:
          npm_config_yes: "true"
          SELF_SCAN_STATIC_RESULT: ${{ needs.static-scan.result }}
          SELF_SCAN_PENTEST_RESULT: ${{ needs.pentest-validation.result }}
          SELF_SCAN_DEPENDENCY_RESULT: ${{ needs.dependency-audit.result }}
          SELF_SCAN_TOTAL_FINDINGS: ${{ needs.static-scan.outputs.total_findings }}
          SELF_SCAN_TOTAL_CRITICAL: ${{ needs.static-scan.outputs.total_critical }}
          SELF_SCAN_RISK_LEVEL: ${{ needs.static-scan.outputs.risk_level }}
          SELF_SCAN_NEW_FINDINGS: ${{ needs.static-scan.outputs.new_findings }}
          SELF_SCAN_NEW_CRITICAL_HIGH: ${{ needs.static-scan.outputs.new_critical_high }}
          SELF_SCAN_SCANNER_ERRORS: ${{ needs.static-scan.outputs.scanner_errors }}
          SELF_SCAN_PENTEST_RAN: ${{ needs.pentest-validation.outputs.pentest_ran }}
          SELF_SCAN_PENTEST_CONFIRMED: ${{ needs.pentest-validation.outputs.pentest_confirmed }}
          SELF_SCAN_PENTEST_CONFIRMED_CRITICAL_HIGH: ${{ needs.pentest-validation.outputs.pentest_confirmed_critical_high }}
          SELF_SCAN_DEP_HIGH: ${{ needs.dependency-audit.outputs.high_count }}
          SELF_SCAN_DEP_CRITICAL: ${{ needs.dependency-audit.outputs.critical_count }}
        run: npx tsx scripts/security/self-scan.ts combine --md combined-report.md

      - name: Post PR comment (combined)
        if: github.event_name == 'pull_request'
        continue-on-error: true # reporting only; the gates are the jobs above
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v7.0.1
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('combined-report.md', 'utf8');
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const marker = '## AgenticQA Security Scan';
            const existing = comments.find(c => c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

      - name: Create issue for a failed scheduled run
        # Was `${steps.report.outputs.total_critical}` inside the JS template
        # literal: `steps` is an Actions expression context, not a JavaScript
        # variable, so every scheduled run died with "ReferenceError: steps is
        # not defined" (2026-10-11, 2026-10-18) and no issue was ever opened.
        # Values now arrive through env.
        if: >-
          github.event_name == 'schedule' &&
          (needs.static-scan.result == 'failure' ||
           needs.pentest-validation.result == 'failure' ||
           needs.dependency-audit.result == 'failure')
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v7.0.1
        env:
          NEW_CRITICAL_HIGH: ${{ needs.static-scan.outputs.new_critical_high }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('combined-report.md', 'utf8') + `\nRun: ${process.env.RUN_URL}\n`;
            const date = new Date().toISOString().split('T')[0];
            const n = /^\d+$/.test(process.env.NEW_CRITICAL_HIGH || '') ? process.env.NEW_CRITICAL_HIGH : '?';
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Security self-scan failed: ${n} new critical/high (${date})`,
              body,
              labels: ['security', 'automated'],
            });

      - name: Final status
        run: |
          echo "## Scan Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Static Scan | ${{ needs.static-scan.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Pentest Validation | ${{ needs.pentest-validation.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Dependency Audit | ${{ needs.dependency-audit.result }} |" >> $GITHUB_STEP_SUMMARY
