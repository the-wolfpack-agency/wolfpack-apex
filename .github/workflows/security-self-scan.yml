name: AgenticQA Security Self-Scan

on:
  push:
    branches: [main]
    paths: ['src/**']
  pull_request:
    branches: [main]
  schedule:
    # Weekly: Sunday 2 AM UTC
    - cron: '0 2 * * 0'
  workflow_dispatch:
    inputs:
      scan_phase:
        description: 'Which phases to run'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - scan
          - pentest
          - dependency
      fail_on_critical:
        description: 'Fail if critical findings'
        required: false
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: security-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ──────────────────────────────────────────────────
  # Job 1: Static Security Scan (AgenticQA scanners)
  # ──────────────────────────────────────────────────
  static-scan:
    if: >-
      github.event_name != 'workflow_dispatch' ||
      inputs.scan_phase == 'all' ||
      inputs.scan_phase == 'scan'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    name: "Static Security Scan"
    permissions:
      contents: write
      pull-requests: write
      actions: read
    outputs:
      total_findings: ${{ steps.parse.outputs.total_findings }}
      total_critical: ${{ steps.parse.outputs.total_critical }}
      risk_level: ${{ steps.parse.outputs.risk_level }}
    steps:
      - name: Checkout Instinct
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Check if PAT is configured
        id: pat-check
        env:
          PAT: ${{ secrets.AGENTICQA_REPO_PAT }}
        run: |
          if [ -z "${PAT}" ]; then
            echo "configured=false" >> $GITHUB_OUTPUT
            echo "::warning::AGENTICQA_REPO_PAT secret not set — static scan will skip. Add it in Settings -> Secrets -> Actions."
          else
            echo "configured=true" >> $GITHUB_OUTPUT
          fi

      - name: Checkout AgenticQA
        if: steps.pat-check.outputs.configured == 'true'
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: nhomyk/AgenticQA
          token: ${{ secrets.AGENTICQA_REPO_PAT }}
          path: AgenticQA
          ref: main
          fetch-depth: 1

      - name: Set up Python 3.13
        if: steps.pat-check.outputs.configured == 'true'
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: AgenticQA/AgenticQA/pyproject.toml

      - name: Install AgenticQA
        if: steps.pat-check.outputs.configured == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -e ./AgenticQA/AgenticQA/

      - name: Run security scan
        if: steps.pat-check.outputs.configured == 'true'
        run: |
          python AgenticQA/AgenticQA/scripts/run_client_scan.py . \
            --json \
            --output scan-results.json
          echo "--- Scan complete ---"

      - name: Parse scan results
        id: parse
        if: steps.pat-check.outputs.configured == 'true'
        run: |
          python3 << 'PYEOF'
          import json, os

          with open("scan-results.json") as f:
              data = json.load(f)

          summary = data.get("summary", {})
          scanners = data.get("scanners", {})

          total_findings = summary.get("total_findings", 0)
          total_critical = summary.get("total_critical", 0)
          risk_level = summary.get("risk_level", "unknown")

          # Check the 6 critical scanner categories
          CRITICAL_SCANNERS = [
              "auth_bypass", "idor", "jwt_security",
              "rate_limit", "error_disclosure", "security_headers"
          ]
          critical_in_key_scanners = 0
          for name in CRITICAL_SCANNERS:
              scanner = scanners.get(name, {})
              if scanner.get("status") == "ok":
                  critical_in_key_scanners += scanner["result"].get("critical", 0)

          # ── Baseline comparison: only fail on NEW findings ──────────
          # Load baseline (committed to repo). If it doesn't exist, this
          # is the first run — save current as baseline and pass.
          import hashlib
          baseline_path = ".agenticqa/scan-baseline.json"
          baseline_hashes = set()
          try:
              with open(baseline_path) as bf:
                  baseline_data = json.load(bf)
                  baseline_hashes = set(baseline_data.get("finding_hashes", []))
          except (FileNotFoundError, json.JSONDecodeError):
              pass

          # Hash each finding by file+line+cwe for stable identity
          current_hashes = set()
          all_findings_list = []
          for name in CRITICAL_SCANNERS:
              scanner = scanners.get(name, {})
              if scanner.get("status") == "ok":
                  for f in scanner["result"].get("findings", []):
                      h = hashlib.sha256(
                          f"{f.get('file','')}:{f.get('line',0)}:{f.get('cwe','')}".encode()
                      ).hexdigest()[:16]
                      current_hashes.add(h)
                      all_findings_list.append({**f, "_hash": h})

          new_findings = current_hashes - baseline_hashes
          new_critical = sum(
              1 for f in all_findings_list
              if f["_hash"] in new_findings and f.get("severity") in ("critical", "high")
          )

          # Save current as baseline for next run
          os.makedirs(os.path.dirname(baseline_path), exist_ok=True)
          with open(baseline_path, "w") as bf:
              json.dump({
                  "finding_hashes": sorted(current_hashes),
                  "total": len(current_hashes),
                  "generated_at": __import__("datetime").datetime.utcnow().isoformat(),
              }, bf, indent=2)

          # Override: only NEW critical/high findings should fail the pipeline
          critical_in_key_scanners = new_critical

          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write(f"total_findings={total_findings}\n")
              out.write(f"total_critical={total_critical}\n")
              out.write(f"risk_level={risk_level}\n")
              out.write(f"critical_in_key_scanners={critical_in_key_scanners}\n")

          # Build markdown table for PR comment
          rows = []
          for name in CRITICAL_SCANNERS:
              scanner = scanners.get(name, {})
              if scanner.get("status") == "ok":
                  r = scanner["result"]
                  findings = r.get("total_findings", 0)
                  crit = r.get("critical", 0)
                  status = "PASS" if crit == 0 else "FAIL"
              elif scanner.get("status") == "error":
                  findings = "err"
                  crit = "err"
                  status = "ERROR"
              else:
                  findings = "-"
                  crit = "-"
                  status = "SKIP"
              display = name.replace("_", " ").title()
              rows.append(f"| {display} | {findings} | {crit} | {status} |")

          table = "| Scanner | Findings | Critical | Status |\n"
          table += "|---------|----------|----------|--------|\n"
          table += "\n".join(rows)

          # Write table to file for the comment step
          with open("scan-table.md", "w") as f:
              f.write(table)

          # Write full JSON details for the collapsible section
          with open("scan-details.json", "w") as f:
              json.dump(data, f, indent=2, default=str)

          PYEOF

      - name: Upload scan results
        if: steps.pat-check.outputs.configured == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: scan-results
          path: scan-results.json
          retention-days: 30

      - name: Post PR comment
        if: >-
          steps.pat-check.outputs.configured == 'true' &&
          github.event_name == 'pull_request'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v7.0.1
        with:
          script: |
            const fs = require('fs');
            const table = fs.readFileSync('scan-table.md', 'utf8');
            const details = fs.readFileSync('scan-details.json', 'utf8');
            const totalFindings = '${{ steps.parse.outputs.total_findings }}';
            const totalCritical = '${{ steps.parse.outputs.total_critical }}';
            const riskLevel = '${{ steps.parse.outputs.risk_level }}';

            const body = `## AgenticQA Security Scan

            ${table}

            **Risk level**: ${riskLevel} | **Total findings**: ${totalFindings} | **Critical**: ${totalCritical}

            <details>
            <summary>Full scan details</summary>

            \`\`\`json
            ${details}
            \`\`\`

            </details>

            _Scan ran on commit ${context.sha.substring(0, 7)}_`;

            // Find and update existing comment or create new one
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const marker = '## AgenticQA Security Scan';
            const existing = comments.find(c => c.body.startsWith(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

      - name: Commit updated baseline
        if: steps.pat-check.outputs.configured == 'true'
        run: |
          if [ -f .agenticqa/scan-baseline.json ]; then
            git config user.name "AgenticQA Bot"
            git config user.email "agenticqa@wolfpack.dev"
            git add .agenticqa/scan-baseline.json
            git diff --cached --quiet || git commit -m "chore: update security scan baseline [skip ci]"
            git push || echo "Push failed (non-blocking)"
          fi

      - name: Fail on NEW critical findings only
        if: >-
          steps.pat-check.outputs.configured == 'true' &&
          (github.event_name != 'workflow_dispatch' || inputs.fail_on_critical == true) &&
          steps.parse.outputs.critical_in_key_scanners != '0'
        run: |
          echo "::error::NEW critical/high findings detected: ${{ steps.parse.outputs.critical_in_key_scanners }}"
          echo "These are findings not present in the previous baseline."
          echo "If these are false positives, the baseline will auto-update on the next green run."
          exit 1

      - name: Skip notice
        if: steps.pat-check.outputs.configured != 'true'
        run: |
          echo "## Static Scan — Skipped" >> $GITHUB_STEP_SUMMARY
          echo "AGENTICQA_REPO_PAT secret is not configured." >> $GITHUB_STEP_SUMMARY
          echo "Add a PAT with \`repo\` scope to enable scanning." >> $GITHUB_STEP_SUMMARY

  # ──────────────────────────────────────────────────
  # Job 2: Pentest Validation
  # ──────────────────────────────────────────────────
  pentest-validation:
    needs: [static-scan]
    if: >-
      always() &&
      needs.static-scan.result != 'cancelled' &&
      (github.event_name != 'workflow_dispatch' ||
       inputs.scan_phase == 'all' ||
       inputs.scan_phase == 'pentest')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    name: "Pentest Validation"
    steps:
      - name: Checkout Instinct
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Check if PAT is configured
        id: pat-check
        env:
          PAT: ${{ secrets.AGENTICQA_REPO_PAT }}
        run: |
          if [ -z "${PAT}" ]; then
            echo "configured=false" >> $GITHUB_OUTPUT
            echo "::warning::AGENTICQA_REPO_PAT secret not set — pentest validation will skip."
          else
            echo "configured=true" >> $GITHUB_OUTPUT
          fi

      - name: Checkout AgenticQA
        if: steps.pat-check.outputs.configured == 'true'
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: nhomyk/AgenticQA
          token: ${{ secrets.AGENTICQA_REPO_PAT }}
          path: AgenticQA
          ref: main
          fetch-depth: 1

      - name: Set up Python 3.13
        if: steps.pat-check.outputs.configured == 'true'
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: AgenticQA/AgenticQA/pyproject.toml

      - name: Install AgenticQA
        if: steps.pat-check.outputs.configured == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -e ./AgenticQA/AgenticQA/

      - name: Download scan results
        if: steps.pat-check.outputs.configured == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: scan-results
          path: ./scan-data
        continue-on-error: true

      - name: Run pentest validation
        id: pentest
        if: steps.pat-check.outputs.configured == 'true'
        run: |
          # self_hack.py may not exist yet — run it if available,
          # otherwise fall back to a re-scan with --fail-on-critical
          if [ -f AgenticQA/AgenticQA/scripts/self_hack.py ]; then
            python AgenticQA/AgenticQA/scripts/self_hack.py . \
              --phase pentest \
              --json \
              --output pentest-results.json
          else
            echo "::warning::self_hack.py not found — running scan with --fail-on-critical as fallback"
            python AgenticQA/AgenticQA/scripts/run_client_scan.py . \
              --json \
              --output pentest-results.json
          fi

      - name: Upload pentest results
        if: steps.pat-check.outputs.configured == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pentest-results
          path: pentest-results.json
          retention-days: 30

      - name: Check for confirmed critical vulnerabilities
        if: steps.pat-check.outputs.configured == 'true'
        run: |
          python3 << 'PYEOF'
          import json, sys

          try:
              with open("pentest-results.json") as f:
                  data = json.load(f)
              critical = data.get("summary", {}).get("total_critical", 0)
              if critical > 0:
                  print(f"::error::Confirmed critical vulnerabilities: {critical}")
                  sys.exit(1)
              print(f"Pentest validation passed — 0 confirmed critical vulnerabilities")
          except FileNotFoundError:
              print("::warning::No pentest results file found")
          PYEOF

  # ──────────────────────────────────────────────────
  # Job 3: Dependency Audit
  # ──────────────────────────────────────────────────
  dependency-audit:
    if: >-
      github.event_name != 'workflow_dispatch' ||
      inputs.scan_phase == 'all' ||
      inputs.scan_phase == 'dependency'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    name: "Dependency Audit"
    outputs:
      high_count: ${{ steps.parse.outputs.high_count }}
      critical_count: ${{ steps.parse.outputs.critical_count }}
    steps:
      - name: Checkout Instinct
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v4.0.4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Run npm audit
        id: audit
        run: |
          npm audit --json > npm-audit.json 2>&1 || true
          echo "--- npm audit complete ---"

      - name: Parse audit results
        id: parse
        run: |
          python3 << 'PYEOF'
          import json, os, sys

          try:
              with open("npm-audit.json") as f:
                  data = json.load(f)
          except (json.JSONDecodeError, FileNotFoundError):
              # npm audit sometimes outputs non-JSON on error
              with open(os.environ["GITHUB_OUTPUT"], "a") as out:
                  out.write("high_count=0\n")
                  out.write("critical_count=0\n")
              print("::warning::Could not parse npm audit output")
              sys.exit(0)

          vulns = data.get("metadata", {}).get("vulnerabilities", {})
          high = vulns.get("high", 0)
          critical = vulns.get("critical", 0)

          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write(f"high_count={high}\n")
              out.write(f"critical_count={critical}\n")

          print(f"Dependency audit: {high} high, {critical} critical")

          # Write summary for the table
          with open("dep-summary.md", "w") as f:
              f.write(f"**Dependency Audit**: {high} high, {critical} critical CVEs\n")
          PYEOF

      - name: Upload audit results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: npm-audit
          path: npm-audit.json
          retention-days: 30

      - name: Fail on high/critical CVEs
        if: >-
          (github.event_name != 'workflow_dispatch' || inputs.fail_on_critical == true) &&
          (steps.parse.outputs.high_count != '0' || steps.parse.outputs.critical_count != '0')
        run: |
          echo "::error::npm audit found ${{ steps.parse.outputs.high_count }} high and ${{ steps.parse.outputs.critical_count }} critical CVEs"
          exit 1

  # ──────────────────────────────────────────────────
  # Job 4: Scan Summary
  # ──────────────────────────────────────────────────
  scan-summary:
    needs: [static-scan, pentest-validation, dependency-audit]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    name: "Scan Summary"
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      - name: Checkout (for issue creation context)
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Download all artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: ./artifacts
        continue-on-error: true

      - name: Generate combined report
        id: report
        run: |
          python3 << 'PYEOF'
          import json, os, datetime

          scan_data = {}
          pentest_data = {}
          audit_data = {}

          # Load scan results
          try:
              with open("artifacts/scan-results/scan-results.json") as f:
                  scan_data = json.load(f)
          except (FileNotFoundError, json.JSONDecodeError):
              pass

          # Load pentest results
          try:
              with open("artifacts/pentest-results/pentest-results.json") as f:
                  pentest_data = json.load(f)
          except (FileNotFoundError, json.JSONDecodeError):
              pass

          # Load npm audit
          try:
              with open("artifacts/npm-audit/npm-audit.json") as f:
                  audit_data = json.load(f)
          except (FileNotFoundError, json.JSONDecodeError):
              pass

          # Build scanners table
          scanners = scan_data.get("scanners", {})
          CRITICAL_SCANNERS = [
              "auth_bypass", "idor", "jwt_security",
              "rate_limit", "error_disclosure", "security_headers"
          ]
          table_rows = []
          for name in CRITICAL_SCANNERS:
              scanner = scanners.get(name, {})
              if scanner.get("status") == "ok":
                  r = scanner["result"]
                  findings = r.get("total_findings", 0)
                  crit = r.get("critical", 0)
                  status = "PASS" if crit == 0 else "FAIL"
              else:
                  findings = "-"
                  crit = "-"
                  status = "SKIP"
              display = name.replace("_", " ").title()
              table_rows.append(f"| {display} | {findings} | {crit} | {status} |")

          # Dep audit summary
          vulns = audit_data.get("metadata", {}).get("vulnerabilities", {})
          dep_high = vulns.get("high", 0)
          dep_crit = vulns.get("critical", 0)

          summary = scan_data.get("summary", {})
          total_findings = summary.get("total_findings", 0)
          total_critical = summary.get("total_critical", 0)
          risk_level = summary.get("risk_level", "unknown")

          report = f"""## AgenticQA Security Scan

          | Scanner | Findings | Critical | Status |
          |---------|----------|----------|--------|
          {chr(10).join(table_rows)}

          **Dependency Audit**: {dep_high} high / {dep_crit} critical CVEs

          **Overall**: {total_findings} findings, {total_critical} critical, risk={risk_level}

          <details>
          <summary>Full scan details</summary>

          ```json
          {json.dumps(scan_data, indent=2, default=str)[:50000]}
          ```

          </details>
          """

          # De-indent the report (it was indented for readability in the heredoc)
          import textwrap
          report = textwrap.dedent(report)

          with open("combined-report.md", "w") as f:
              f.write(report)

          # Signal whether to create an issue
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write(f"total_critical={total_critical}\n")
              out.write(f"risk_level={risk_level}\n")

          PYEOF

      - name: Write step summary
        run: cat combined-report.md >> $GITHUB_STEP_SUMMARY

      - name: Post PR comment (combined)
        if: github.event_name == 'pull_request'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v7.0.1
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('combined-report.md', 'utf8');
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const marker = '## AgenticQA Security Scan';
            const existing = comments.find(c => c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

      - name: Create issue for scheduled runs
        if: >-
          github.event_name == 'schedule' &&
          steps.report.outputs.total_critical != '0'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v7.0.1
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('combined-report.md', 'utf8');
            const date = new Date().toISOString().split('T')[0];
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Security Scan: ${steps.report.outputs.total_critical} critical findings (${date})`,
              body,
              labels: ['security', 'automated'],
            });

      - name: Final status
        run: |
          echo "## Scan Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Static Scan | ${{ needs.static-scan.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Pentest Validation | ${{ needs.pentest-validation.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Dependency Audit | ${{ needs.dependency-audit.result }} |" >> $GITHUB_STEP_SUMMARY
