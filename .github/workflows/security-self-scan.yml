name: AgenticQA Security Self-Scan

on:
  push:
    branches: [main]
    paths: ['src/**']
  pull_request:
    branches: [main]
  schedule:
    # Weekly: Sunday 2 AM UTC
    - cron: '0 2 * * 0'
  workflow_dispatch:
    inputs:
      scan_phase:
        description: 'Which phases to run'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - scan
          - pentest
          - dependency
      fail_on_critical:
        description: 'Fail if critical findings'
        required: false
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: security-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ──────────────────────────────────────────────────
  # Job 1: Static Security Scan (AgenticQA scanners)
  # ──────────────────────────────────────────────────
  static-scan:
    if: >-
      github.event_name != 'workflow_dispatch' ||
      inputs.scan_phase == 'all' ||
      inputs.scan_phase == 'scan'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    name: "Static Security Scan"
    permissions:
      contents: write
      pull-requests: write
      actions: read
    outputs:
      total_findings: ${{ steps.parse.outputs.total_findings }}
      total_critical: ${{ steps.parse.outputs.total_critical }}
      risk_level: ${{ steps.parse.outputs.risk_level }}
    steps:
      - name: Checkout Instinct
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Check if PAT is configured
        id: pat-check
        env:
          PAT: ${{ secrets.AGENTICQA_REPO_PAT }}
        run: |
          if [ -z "${PAT}" ]; then
            echo "configured=false" >> $GITHUB_OUTPUT
            echo "::warning::AGENTICQA_REPO_PAT secret not set, static scan will skip. Add it in Settings -> Secrets -> Actions."
          else
            echo "configured=true" >> $GITHUB_OUTPUT
          fi

      - name: Checkout AgenticQA
        if: steps.pat-check.outputs.configured == 'true'
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: nhomyk/AgenticQA
          token: ${{ secrets.AGENTICQA_REPO_PAT }}
          # Vendored under vendor/ so the scanner's SKIP_DIRS excludes
          # it, run_client_scan scans only Instinct, not the tool's
          # own intentionally-vulnerable fixtures.
          path: vendor/agenticqa-tool
          ref: main
          fetch-depth: 1

      - name: Set up Python 3.13
        if: steps.pat-check.outputs.configured == 'true'
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: vendor/agenticqa-tool/AgenticQA/pyproject.toml

      - name: Install AgenticQA
        if: steps.pat-check.outputs.configured == 'true'
        run: |
          # Pinned: an unpinned `--upgrade pip` means the toolchain that
          # installs our scanner is whatever shipped that morning, which is the
          # one dependency a security workflow should not be casual about.
          # Bump deliberately, the same way any other dependency moves.
          python -m pip install --upgrade "pip==26.2"
          pip install -e ./vendor/agenticqa-tool/AgenticQA/

      - name: Run security scan
        if: steps.pat-check.outputs.configured == 'true'
        run: |
          python vendor/agenticqa-tool/AgenticQA/scripts/run_client_scan.py . \
            --json \
            --output scan-results.json
          echo "--- Scan complete ---"

      - name: Parse scan results
        id: parse
        if: steps.pat-check.outputs.configured == 'true'
        run: |
          # ONE source of truth for the table AND the gate:
          # scripts/security-scan-report.py computes each scanner's Status from
          # NEW-vs-baseline findings (not raw counts) after dropping the
          # human-verified false positives in .agenticqa/suppressions.json, and
          # emits the SAME gating number the gate step below enforces. This ends
          # the split-brain where the comment shouted "FAIL / risk=critical" on a
          # PR the gate passed and merged. Unit-tested at
          # src/__tests__/security-scan-report.test.ts.
          python3 scripts/security-scan-report.py scan-results.json \
            --baseline .agenticqa/scan-baseline.json \
            --suppressions .agenticqa/suppressions.json \
            --table-out scan-table.md \
            --github-output "$GITHUB_OUTPUT"

          # Full JSON for the collapsible PR-comment section.
          cp scan-results.json scan-details.json

          # Regenerate the baseline from today's gate-scanner findings so the
          # next run compares against current. (Committed only on push to main by
          # a later step; PR runs read it read-only.)
          python3 << 'PYEOF'
          import json, os, datetime
          from agenticqa.security.finding_fingerprint import fingerprint
          data = json.load(open("scan-results.json"))
          CRITICAL_SCANNERS = ["auth_bypass", "idor", "jwt_security",
                               "rate_limit", "error_disclosure", "security_headers"]
          hashes = set()
          for name in CRITICAL_SCANNERS:
              sc = data.get("scanners", {}).get(name, {})
              if sc.get("status") == "ok":
                  for f in sc["result"].get("findings", []):
                      hashes.add(fingerprint(f))
          os.makedirs(".agenticqa", exist_ok=True)
          json.dump({
              "finding_hashes": sorted(hashes),
              "total": len(hashes),
              "generated_at": datetime.datetime.utcnow().isoformat(),
          }, open(".agenticqa/scan-baseline.json", "w"), indent=2)
          PYEOF

      - name: Upload scan results
        if: steps.pat-check.outputs.configured == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: scan-results
          path: scan-results.json
          retention-days: 30

      - name: Post PR comment
        # Reporting only, NOT the security gate. Marked best-effort so a comment
        # permission/API hiccup can never skip the downstream "Fail on NEW
        # critical findings" enforcement step (that was a fail-open defect: a
        # cosmetic comment failure silently disabled the security gate).
        continue-on-error: true
        if: >-
          steps.pat-check.outputs.configured == 'true' &&
          github.event_name == 'pull_request'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v7.0.1
        with:
          script: |
            const fs = require('fs');
            const table = fs.readFileSync('scan-table.md', 'utf8');
            const details = fs.readFileSync('scan-details.json', 'utf8');
            const totalFindings = '${{ steps.parse.outputs.total_findings }}';
            const totalCritical = '${{ steps.parse.outputs.total_critical }}';
            const riskLevel = '${{ steps.parse.outputs.risk_level }}';

            const body = `## AgenticQA Security Scan

            ${table}

            **Risk level**: ${riskLevel} | **Total findings**: ${totalFindings} | **Critical**: ${totalCritical}

            <details>
            <summary>Full scan details</summary>

            \`\`\`json
            ${details}
            \`\`\`

            </details>

            _Scan ran on commit ${context.sha.substring(0, 7)}_`;

            // Find and update existing comment or create new one
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const marker = '## AgenticQA Security Scan';
            const existing = comments.find(c => c.body.startsWith(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

      - name: Commit updated baseline
        # ONLY on push to main, never on pull_request runs. The baseline JSON
        # carries a generated_at timestamp, so a PR run rewrites it even when the
        # findings are identical; committing that to the PR branch then conflicts
        # with main on every push (the merge-conflict churn this stops). Main's
        # baseline is kept current by this same step on push-to-main, and PR runs
        # compare against that committed baseline read-only, so the gate still
        # works without any branch-side writes.
        if: steps.pat-check.outputs.configured == 'true' && github.event_name == 'push'
        # Best-effort: a baseline-commit failure must never fail the scan job (the
        # gate is the separate "Fail on NEW critical findings" step below).
        continue-on-error: true
        env:
          # Pass the ref through the environment rather than interpolating
          # ${{ github.head_ref }} straight into the script. A branch name is
          # attacker-controllable, so inlining it into the shell allows command
          # injection (CodeQL/Scorecard: dangerous workflow). As an env var it is
          # a plain, quoted string that the shell never parses as code.
          TARGET_REF: ${{ github.head_ref || github.ref_name }}
        run: |
          [ -f .agenticqa/scan-baseline.json ] || exit 0
          git config user.name "AgenticQA Bot"
          git config user.email "agenticqa@wolfpack.dev"
          # On a pull_request run, actions/checkout checks out the detached
          # refs/pull/<n>/merge ref, so `git push` has no branch to push to and
          # dies with exit 128 - which is why the baseline never auto-updated on
          # PRs and every PR got stuck on stale-baseline drift. Re-anchor onto the
          # real target branch (the PR head, or main on a push run) before
          # committing the regenerated baseline.
          TARGET="$TARGET_REF"
          cp .agenticqa/scan-baseline.json /tmp/scan-baseline.json
          git fetch origin "$TARGET" --depth=1
          git checkout -B "$TARGET" "origin/$TARGET"
          cp /tmp/scan-baseline.json .agenticqa/scan-baseline.json
          git add .agenticqa/scan-baseline.json
          git diff --cached --quiet && { echo "Baseline unchanged."; exit 0; }
          git commit -m "chore: update security scan baseline [skip ci]"
          git push origin "$TARGET" || echo "Push failed (non-blocking)"

      - name: Fail on NEW critical findings only
        if: >-
          steps.pat-check.outputs.configured == 'true' &&
          (github.event_name != 'workflow_dispatch' || inputs.fail_on_critical == true) &&
          steps.parse.outputs.critical_in_key_scanners != '0'
        run: |
          echo "::error::NEW critical/high findings detected: ${{ steps.parse.outputs.critical_in_key_scanners }}"
          echo "These are findings not present in the previous baseline."
          echo "If these are false positives, the baseline will auto-update on the next green run."
          exit 1

      - name: Skip notice
        if: steps.pat-check.outputs.configured != 'true'
        run: |
          echo "## Static Scan: Skipped" >> $GITHUB_STEP_SUMMARY
          echo "AGENTICQA_REPO_PAT secret is not configured." >> $GITHUB_STEP_SUMMARY
          echo "Add a PAT with \`repo\` scope to enable scanning." >> $GITHUB_STEP_SUMMARY

  # ──────────────────────────────────────────────────
  # Job 2: Pentest Validation
  # ──────────────────────────────────────────────────
  pentest-validation:
    needs: [static-scan]
    if: >-
      always() &&
      needs.static-scan.result != 'cancelled' &&
      (github.event_name != 'workflow_dispatch' ||
       inputs.scan_phase == 'all' ||
       inputs.scan_phase == 'pentest')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    name: "Pentest Validation"
    steps:
      - name: Checkout Instinct
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Check if PAT is configured
        id: pat-check
        env:
          PAT: ${{ secrets.AGENTICQA_REPO_PAT }}
        run: |
          if [ -z "${PAT}" ]; then
            echo "configured=false" >> $GITHUB_OUTPUT
            echo "::warning::AGENTICQA_REPO_PAT secret not set, pentest validation will skip."
          else
            echo "configured=true" >> $GITHUB_OUTPUT
          fi

      - name: Checkout AgenticQA
        if: steps.pat-check.outputs.configured == 'true'
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: nhomyk/AgenticQA
          token: ${{ secrets.AGENTICQA_REPO_PAT }}
          # Vendored under vendor/ so the scanner's SKIP_DIRS excludes
          # it, run_client_scan scans only Instinct, not the tool's
          # own intentionally-vulnerable fixtures.
          path: vendor/agenticqa-tool
          ref: main
          fetch-depth: 1

      - name: Set up Python 3.13
        if: steps.pat-check.outputs.configured == 'true'
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: vendor/agenticqa-tool/AgenticQA/pyproject.toml

      - name: Install AgenticQA
        if: steps.pat-check.outputs.configured == 'true'
        run: |
          # Pinned: an unpinned `--upgrade pip` means the toolchain that
          # installs our scanner is whatever shipped that morning, which is the
          # one dependency a security workflow should not be casual about.
          # Bump deliberately, the same way any other dependency moves.
          python -m pip install --upgrade "pip==26.2"
          pip install -e ./vendor/agenticqa-tool/AgenticQA/

      - name: Download scan results
        if: steps.pat-check.outputs.configured == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: scan-results
          path: ./scan-data
        continue-on-error: true

      - name: Run pentest validation
        id: pentest
        if: steps.pat-check.outputs.configured == 'true'
        run: |
          # self_hack.py may not exist yet, run it if available,
          # otherwise fall back to a re-scan with --fail-on-critical
          if [ -f vendor/agenticqa-tool/AgenticQA/scripts/self_hack.py ]; then
            python vendor/agenticqa-tool/AgenticQA/scripts/self_hack.py . \
              --phase pentest \
              --json \
              --output pentest-results.json
          else
            echo "::warning::self_hack.py not found, running scan with --fail-on-critical as fallback"
            python vendor/agenticqa-tool/AgenticQA/scripts/run_client_scan.py . \
              --json \
              --output pentest-results.json
          fi

      - name: Upload pentest results
        if: steps.pat-check.outputs.configured == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pentest-results
          path: pentest-results.json
          retention-days: 30

      - name: Check for confirmed critical vulnerabilities
        if: steps.pat-check.outputs.configured == 'true'
        run: |
          python3 << 'PYEOF'
          import json, sys

          try:
              with open("pentest-results.json") as f:
                  data = json.load(f)
              critical = data.get("summary", {}).get("total_critical", 0)
              if critical > 0:
                  print(f"::error::Confirmed critical vulnerabilities: {critical}")
                  sys.exit(1)
              print(f"Pentest validation passed, 0 confirmed critical vulnerabilities")
          except FileNotFoundError:
              print("::warning::No pentest results file found")
          PYEOF

  # ──────────────────────────────────────────────────
  # Job 3: Dependency Audit
  # ──────────────────────────────────────────────────
  dependency-audit:
    if: >-
      github.event_name != 'workflow_dispatch' ||
      inputs.scan_phase == 'all' ||
      inputs.scan_phase == 'dependency'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    name: "Dependency Audit"
    outputs:
      high_count: ${{ steps.parse.outputs.high_count }}
      critical_count: ${{ steps.parse.outputs.critical_count }}
    steps:
      - name: Checkout Instinct
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v4.0.4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Run npm audit
        id: audit
        run: |
          # Audit production dependencies only. Dev-only build tooling
          # (eslint, jest and their transitive glob/brace-expansion) never
          # ships to production, and Dependabot already covers every
          # dependency on the repo security page. This mirrors the prod-only
          # audit in agenticqa-full-pipeline.yml.
          npm audit --omit=dev --json > npm-audit.json 2>&1 || true
          echo "--- npm audit complete ---"

      - name: Parse audit results
        id: parse
        run: |
          python3 << 'PYEOF'
          import json, os, sys

          try:
              with open("npm-audit.json") as f:
                  data = json.load(f)
          except (json.JSONDecodeError, FileNotFoundError):
              # npm audit sometimes outputs non-JSON on error
              with open(os.environ["GITHUB_OUTPUT"], "a") as out:
                  out.write("high_count=0\n")
                  out.write("critical_count=0\n")
              print("::warning::Could not parse npm audit output")
              sys.exit(0)

          vulns = data.get("metadata", {}).get("vulnerabilities", {})
          high = vulns.get("high", 0)
          critical = vulns.get("critical", 0)

          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write(f"high_count={high}\n")
              out.write(f"critical_count={critical}\n")

          print(f"Dependency audit: {high} high, {critical} critical")

          # Write summary for the table
          with open("dep-summary.md", "w") as f:
              f.write(f"**Dependency Audit**: {high} high, {critical} critical CVEs\n")
          PYEOF

      - name: Upload audit results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: npm-audit
          path: npm-audit.json
          retention-days: 30

      - name: Fail on high/critical CVEs
        if: >-
          (github.event_name != 'workflow_dispatch' || inputs.fail_on_critical == true) &&
          (steps.parse.outputs.high_count != '0' || steps.parse.outputs.critical_count != '0')
        run: |
          echo "::error::npm audit found ${{ steps.parse.outputs.high_count }} high and ${{ steps.parse.outputs.critical_count }} critical CVEs"
          exit 1

  # ──────────────────────────────────────────────────
  # Job 4: Scan Summary
  # ──────────────────────────────────────────────────
  scan-summary:
    needs: [static-scan, pentest-validation, dependency-audit]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    name: "Scan Summary"
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      - name: Checkout (for issue creation context)
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Download all artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: ./artifacts
        continue-on-error: true

      - name: Generate combined report
        id: report
        run: |
          # The scanner table + gate verdict come from the SAME script the
          # static-scan job gates on (scripts/security-scan-report.py), so this
          # comment can no longer disagree with the enforced result. The script
          # is self-contained (inline fingerprint fallback) so it needs no tool
          # install here. Suppressions + baseline are read from the checked-out
          # repo. --gate is intentionally omitted: this step reports, it does not
          # enforce (the static-scan gate step does that).
          SCAN=artifacts/scan-results/scan-results.json
          if [ -f "$SCAN" ]; then
            python3 scripts/security-scan-report.py "$SCAN" \
              --baseline .agenticqa/scan-baseline.json \
              --suppressions .agenticqa/suppressions.json \
              --table-out scan-table.md \
              --github-output "$GITHUB_OUTPUT" || true
          else
            echo "_Scan results artifact not found._" > scan-table.md
          fi

          python3 << 'PYEOF'
          import json

          def load(path):
              try:
                  return json.load(open(path))
              except (FileNotFoundError, json.JSONDecodeError):
                  return {}

          scan_data = load("artifacts/scan-results/scan-results.json")
          audit_data = load("artifacts/npm-audit/npm-audit.json")
          try:
              table = open("scan-table.md").read().strip()
          except FileNotFoundError:
              table = "_No scan table._"

          vulns = audit_data.get("metadata", {}).get("vulnerabilities", {})
          dep_high = vulns.get("high", 0)
          dep_crit = vulns.get("critical", 0)

          report = (
              "## AgenticQA Security Scan\n\n"
              f"{table}\n\n"
              f"**Dependency Audit**: {dep_high} high / {dep_crit} critical CVEs\n\n"
              "Status reflects the enforced gate (new findings vs the committed "
              "baseline, minus reviewed false positives in "
              "`.agenticqa/suppressions.json`), not raw counts.\n\n"
              "<details>\n<summary>Full scan details</summary>\n\n"
              "```json\n"
              f"{json.dumps(scan_data, indent=2, default=str)[:50000]}\n"
              "```\n\n</details>\n"
          )
          with open("combined-report.md", "w") as f:
              f.write(report)
          PYEOF

      - name: Write step summary
        run: cat combined-report.md >> $GITHUB_STEP_SUMMARY

      - name: Post PR comment (combined)
        if: github.event_name == 'pull_request'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v7.0.1
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('combined-report.md', 'utf8');
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const marker = '## AgenticQA Security Scan';
            const existing = comments.find(c => c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

      - name: Create issue for scheduled runs
        if: >-
          github.event_name == 'schedule' &&
          steps.report.outputs.total_critical != '0'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v7.0.1
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('combined-report.md', 'utf8');
            const date = new Date().toISOString().split('T')[0];
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Security Scan: ${steps.report.outputs.total_critical} critical findings (${date})`,
              body,
              labels: ['security', 'automated'],
            });

      - name: Final status
        run: |
          echo "## Scan Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Static Scan | ${{ needs.static-scan.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Pentest Validation | ${{ needs.pentest-validation.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Dependency Audit | ${{ needs.dependency-audit.result }} |" >> $GITHUB_STEP_SUMMARY
