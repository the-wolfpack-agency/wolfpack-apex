# Every ON CONFLICT in the source, checked against the LIVE schema.
#
# WHY AGAINST PRODUCTION, AND NOT A SCHEMA BUILT FROM THE MIGRATIONS.
#
# On 2026-09-02 the Microsoft token store had been failing on 42P10 for at
# least a week: storeTokens upserts on connected_by, and the live index was not
# unique. The migrations were RIGHT — 006 created it unique and 044 renamed it,
# which preserves uniqueness. A check built from the repository would have
# passed on every day of the outage. Only the database knew.
#
# Daily rather than per-push: this catches drift, and drift does not arrive
# with a commit.
name: Upsert targets
on:
  schedule:
    - cron: "20 7 * * *"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # Skips cleanly when unset. A red job meaning "nobody configured this"
      # trains people to ignore red jobs, which is how the original defect
      # survived a week of green dashboards.
      - name: Check every upsert has a unique index to conflict on
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -z "${DATABASE_URL:-}" ]; then
            echo "::notice::DATABASE_URL is not set; skipping. Add the secret to enable this check."
            exit 0
          fi
          npx tsx scripts/check-upsert-targets.ts
