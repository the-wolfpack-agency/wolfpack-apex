name: Tools Honesty Matrix

# Manual verification that the /tools surface actually produces the
# artifacts it claims. Dispatches real runs against prod, polls until
# terminal, and asserts each result carries a hashed artifact manifest
# matching the per-tool contract. See
# tests/e2e/tools-honesty-matrix.spec.ts for the assertions.
#
# Kept as workflow_dispatch (not on-push) so we don't burn ~4 tool runs
# worth of Actions minutes on every PR.

on:
  workflow_dispatch:
    inputs:
      target_url:
        description: 'Target URL to verify'
        required: false
        default: 'https://wolfpack-instinct.vercel.app'

permissions:
  contents: read
  actions: read

jobs:
  matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v4.0.4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - run: npx playwright install --with-deps chromium

      - name: Run honesty matrix
        env:
          TOOLS_HONESTY_MATRIX_LIVE: '1'
          PROD_URL: ${{ inputs.target_url }}
          SMOKE_TEST_EMAIL: ${{ secrets.SMOKE_TEST_EMAIL }}
          SMOKE_TEST_PASSWORD: ${{ secrets.SMOKE_TEST_PASSWORD }}
        run: npx playwright test tests/e2e/tools-honesty-matrix.spec.ts --reporter=github

      - name: Upload playwright report on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: honesty-matrix-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
