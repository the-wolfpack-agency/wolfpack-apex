name: Dependabot auto-merge

# Auto-merges green patch/minor Dependabot PRs.
# Major version bumps ALWAYS require manual review (filtered out below).
#
# Why pull_request_target: lets us merge from forks Dependabot pushes from
# the bot account, with secrets available. We never check out PR code here
# (only inspect metadata + call gh CLI), so this is safe.

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  dependabot-auto-merge:
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Fetch Dependabot metadata
        id: meta
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v2.3.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # Satisfy the "require 1 approving review" rule. Dependabot PRs never land
      # in a human review queue, so without this a green patch/minor bump waits
      # forever. Scoped to patch/minor only; majors still need a human. The
      # approval is by github-actions[bot] (a non-author), so it counts.
      - name: Approve patch + minor updates
        if: |
          steps.meta.outputs.update-type == 'version-update:semver-patch' ||
          steps.meta.outputs.update-type == 'version-update:semver-minor'
        run: gh pr review --approve "$PR_URL" --body "Auto-approved Dependabot patch/minor bump; merge still gates on the required status checks."
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Enable auto-merge for patch + minor updates
        if: |
          steps.meta.outputs.update-type == 'version-update:semver-patch' ||
          steps.meta.outputs.update-type == 'version-update:semver-minor'
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
