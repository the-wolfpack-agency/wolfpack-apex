name: "Factory reliability benchmark"

# Measurement, not a gate. Runs a realistic SDLC case set through the LIVE factory
# and records a reliability scorecard (first-pass-ready / expectation-match /
# escalation) so we can watch the trend. Dispatch + weekly only - it spends real
# model tokens, so it never runs per-PR.
on:
  workflow_dispatch:
  schedule:
    - cron: "23 12 * * 1" # Mondays ~12:23 UTC

permissions:
  contents: read

concurrency:
  group: factory-benchmark
  cancel-in-progress: true

jobs:
  benchmark:
    name: Reliability benchmark (live)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      CI: "true"
      PROD_URL: ${{ secrets.PROD_URL }}
      SMOKE_TEST_EMAIL: ${{ secrets.SMOKE_TEST_EMAIL }}
      SMOKE_TEST_PASSWORD: ${{ secrets.SMOKE_TEST_PASSWORD }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Require PROD_URL (the benchmark targets the live deployment)
        id: cfg
        timeout-minutes: 2
        run: |
          if [ -z "${PROD_URL}" ]; then
            echo "configured=false" >> $GITHUB_OUTPUT
            echo "::warning::PROD_URL secret not set - benchmark SKIPPED. Add PROD_URL + SMOKE_TEST_EMAIL + SMOKE_TEST_PASSWORD in Settings -> Secrets -> Actions."
          else
            echo "configured=true" >> $GITHUB_OUTPUT
          fi

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v4.0.4
        if: steps.cfg.outputs.configured == 'true'
        timeout-minutes: 5
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        if: steps.cfg.outputs.configured == 'true'
        timeout-minutes: 8
        run: npm ci

      - name: Cache Playwright browsers
        if: steps.cfg.outputs.configured == 'true'
        id: pw-cache
        timeout-minutes: 5
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright browser
        if: steps.cfg.outputs.configured == 'true' && steps.pw-cache.outputs.cache-hit != 'true'
        timeout-minutes: 8
        run: npx playwright install chromium

      - name: Install OS libraries for Chromium
        if: steps.cfg.outputs.configured == 'true'
        timeout-minutes: 6
        continue-on-error: true
        run: |
          timeout 150 npx playwright install-deps chromium \
            || (echo "retrying once" && sleep 10 && timeout 150 npx playwright install-deps chromium) \
            || echo "::warning::playwright install-deps failed (apt mirror). Continuing."

      - name: Run the reliability benchmark
        if: steps.cfg.outputs.configured == 'true'
        timeout-minutes: 35
        run: >-
          npx playwright test
          tests/e2e/ai-code-factory-benchmark.spec.ts
          --config=playwright.config.ts
          --reporter=github

      - name: Upload reliability scorecard + report
        if: always()
        timeout-minutes: 5
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: factory-reliability-scorecard
          path: |
            playwright-report/
            test-results/
