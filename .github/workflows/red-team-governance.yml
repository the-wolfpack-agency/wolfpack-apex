name: Red Team Governance Scan

on:
  schedule:
    - cron: '30 3 * * 0'
  push:
    branches: [main]
    paths:
      - 'src/lib/auth-guard.ts'
      - 'src/lib/auth.ts'
      - 'src/middleware.ts'
      - 'src/lib/rate-limit.ts'
      - 'src/lib/tenant-context.ts'
      - 'src/lib/tenant-resolver.ts'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  red-team:
    uses: the-wolfpack-agency/AgenticQA-core/.github/workflows/red-team-governance.yml@664a57b1089a6d83061f01198dc7cd2d5fb7fbca # main
    with:
      repo: ${{ github.repository }}
      branch: ${{ github.ref_name }}
      # Boolean per the reusable workflow's input type; the prior 'false'
      # string caused startup_failure on push (run 25887380989).
      apply: false
    # The reusable workflow reads branch protection with
    # `secrets.ADMIN_TOKEN || github.token`. No ADMIN_TOKEN was defined, so
    # every run fell back to github.token, which cannot read branch protection
    # at any permission level: reading it needs repo admin, and there is no
    # `administration` key available to a workflow permissions block. The job
    # had therefore failed on 403 every week since 2026-08-02, which is a scan
    # of our governance that could not read our governance.
    #
    # `secrets: inherit` did not help, because inheriting a secret that was
    # never defined still yields an empty value. Mapped explicitly instead.
    secrets:
      ADMIN_TOKEN: ${{ secrets.AGENTICQA_REPO_PAT }}
