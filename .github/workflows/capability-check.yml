# Ask every capability we claim whether it has ever actually done it.
#
# Four capabilities were built, tested, configured in production and had never
# run once. Every one was found by accident, weeks late, while chasing
# something else. None failed loudly, because a capability nothing exercises
# does not degrade: it simply never was, and the code reads the same either way.
#
# Runs daily and on demand. Fails only when something on the register has NEVER
# done its job, which is a fact worth a red tick and one nothing else catches.
name: Capability check

on:
  schedule:
    - cron: "40 13 * * *"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: capability-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    # Six counting queries and an install. Generous, and far short of the
    # six-hour default a hang would otherwise burn.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: What we claim, and what has done it
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npm run capabilities
