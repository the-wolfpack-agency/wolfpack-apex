name: E2E Reality Check

# Browser-level reality-check specs — the layer that catches parity regressions
# 400+ jest tests miss. Restructured for speed + reliability:
#   * Targets the DEPLOYED app via PROD_URL. If PROD_URL is unset the job SKIPS
#     with a loud warning, instead of silently booting a local `next dev` server
#     that cold-compiles every route (slow) and flakes on dev-mode CSP/eval — the
#     exact cause of the recurring dashboard-quick-actions timeouts.
#   * The Playwright browser is cached, so the ~1-2 min install only runs on a
#     version bump.
#   * The two HARD gates run in ONE parallel invocation on every PR + push.
#   * The SOFT specs run in ONE invocation on push-to-main ONLY, so they stay off
#     the PR critical path (they never gated a merge; they only delayed it).
#
# To make the gates run: set PROD_URL (+ SMOKE_* for the soft specs) in repo
# secrets. To promote a soft spec to a hard gate, move it into the gates step.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: e2e-reality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  reality-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI: "true"
      PROD_URL: ${{ secrets.PROD_URL }}
      SMOKE_TEST_EMAIL: ${{ secrets.SMOKE_TEST_EMAIL }}
      # The per-role sweep signs in as each of the five non-admin test accounts,
      # which share one password. Without it every_role.spec skips, and a
      # skipped Playwright test reports as a pass.
      ADMIN_E2E_PASSWORD: ${{ secrets.ADMIN_E2E_PASSWORD }}
      SMOKE_TEST_PASSWORD: ${{ secrets.SMOKE_TEST_PASSWORD }}
      SITES_SMOKE_PROJECT_ID: ${{ secrets.SITES_SMOKE_PROJECT_ID }}

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Require PROD_URL (reality-check targets the live deployment)
        id: cfg
        run: |
          if [ -z "${PROD_URL}" ]; then
            echo "configured=false" >> $GITHUB_OUTPUT
            echo "::warning::PROD_URL secret not set — reality-check SKIPPED. It must target the deployed app; a local dev server cold-compiles routes and flakes. Add PROD_URL in Settings -> Secrets -> Actions."
          else
            echo "configured=true" >> $GITHUB_OUTPUT
          fi

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v4.0.4
        if: steps.cfg.outputs.configured == 'true'
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        if: steps.cfg.outputs.configured == 'true'
        run: npm ci

      - name: Cache Playwright browsers
        if: steps.cfg.outputs.configured == 'true'
        id: pw-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      # Browsers first, from cache, with no root and no apt. This job already
      # knew deps and browsers were separate concerns; what it did not do was
      # stop the apt half from being fatal. On 2026-08-19 the runner's apt
      # mirror stopped answering and the equivalent step in verify.yml burned
      # its whole timeout on retries with every browser already installed.
      # Cache-gated, which is the contract reality-check-workflow.test.ts pins:
      # on a hit the binaries are already on disk and there is nothing to fetch.
      # These two steps existed TWICE, and the first copy of the second one had
      # a name and an `if` and nothing to run. A step with neither `run` nor
      # `uses` is invalid, so GitHub rejected the whole file before creating any
      # jobs: every run failed instantly with "workflow file issue" and zero
      # jobs, which reads in the UI like an infrastructure problem rather than
      # a typo. 100 of the last 100 runs failed this way, going back months.
      #
      # The cost was silent and large. Every spec named below has been dormant:
      # they pass locally, they were added to this file in good faith, and none
      # of them has ever run in CI.
      - name: Install Playwright browser
        if: steps.cfg.outputs.configured == 'true' && steps.pw-cache.outputs.cache-hit != 'true'
        timeout-minutes: 8
        run: npx playwright install chromium
      - name: Install OS libraries for Chromium
        if: steps.cfg.outputs.configured == 'true'
        timeout-minutes: 6
        run: |
          npx playwright install-deps chromium \
            || (echo "retrying once" && sleep 15 && npx playwright install-deps chromium) \
            || echo "::warning::playwright install-deps failed (apt mirror). Continuing: a genuinely missing library surfaces as a browser launch failure in the next step."

      # HARD GATES — one parallel invocation; must pass on PR + push. A parity
      # regression blocks the merge. All three specs are read-only page renders,
      # so --workers=2 is safe and roughly halves the wall time.
      #
      # ai-router-behaviour was added on 2026-08-20 after being found red for
      # weeks: it stubs every response so it needs no credentials, which was
      # written into its header as the reason it could run everywhere, and then
      # it was never listed in a workflow. Five of its assertions had been
      # obsoleted by #279 and nothing said so. A spec no job runs is not a test.
      - name: Reality-check gates (preview parity + dashboard quick-actions)
        if: steps.cfg.outputs.configured == 'true'
        run: >-
          npx playwright test
          tests/e2e/sites-preview-reality-check.spec.ts
          tests/e2e/dashboard-quick-actions.spec.ts
          tests/e2e/ai-router-behaviour.spec.ts
          tests/e2e/playbook-readable.spec.ts
          --config=playwright.config.ts --workers=2 --reporter=github

      # SOFT SPECS — one invocation, push-to-main ONLY (off the PR critical path).
      # They never gated a merge (continue-on-error), so running them on every PR
      # only delayed it. They still run post-merge for visibility, serially
      # (workers:1 from the config) since several mutate. continue-on-error keeps
      # a soft failure from failing the job.
      - name: Reality-check soft specs (post-merge visibility)
        id: soft
        if: steps.cfg.outputs.configured == 'true' && github.event_name == 'push'
        continue-on-error: true
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: soft-spec-results.json
        run: >-
          npx playwright test
          tests/e2e/sites-upload-reality-check.spec.ts
          tests/e2e/assistant-pilot-status.spec.ts
          tests/e2e/assistant-cross-tool-insights.spec.ts
          tests/e2e/sites-designer-journey.spec.ts
          tests/e2e/feature-requests-data-flow.spec.ts
          tests/e2e/feedback-screenshot-flow.spec.ts
          tests/e2e/admin-broadcast.spec.ts
          tests/e2e/ogiam-shadow-flow.spec.ts
          tests/e2e/ogiam-adversarial-flow.spec.ts
          tests/e2e/ogiam-trends.spec.ts
          tests/e2e/agents-onboarding.spec.ts
          tests/e2e/ai-redteam.spec.ts
          tests/e2e/ai-surfaces.spec.ts
          tests/e2e/ai-surfaces-repo-scan.spec.ts
          tests/e2e/compliance.spec.ts
          tests/e2e/compliance-export.spec.ts
          tests/e2e/demo-reset.spec.ts
          tests/e2e/deployment-release-gate.spec.ts
          tests/e2e/governance-sample.spec.ts
          tests/e2e/search-autofocus.spec.ts
          tests/e2e/emails-inbox-flow.spec.ts
          tests/e2e/messages-bugs.spec.ts
          tests/e2e/knowledge-qa-cache.spec.ts
          tests/e2e/admin-mfa.spec.ts
          tests/e2e/routines-loop.spec.ts
          tests/e2e/routines-discovery.spec.ts
          tests/e2e/every-role.spec.ts
          --config=playwright.config.ts --reporter=github,json

      # THE STEP ABOVE CANNOT FAIL, WHICH IS WHY NOBODY KNEW.
      #
      # continue-on-error is right: several of these specs mutate real state and
      # genuinely flake, and blocking every merge on them would get the step
      # deleted inside a week. What was wrong is that failing cost nothing. The
      # run of 2026-08-24 reported SUCCESS while containing "12 failed, 7
      # skipped, 30 passed", and several of those twelve were the same
      # loading-screen bug that kept Verify red on main for two months.
      #
      # So the known-failing set is written down in tests/e2e/known-soft-failures.json
      # with a reason each. A listed failure is reported and tolerated. An
      # unlisted one fails HERE, where the step is allowed to fail. The pile can
      # shrink and cannot silently grow.
      #
      # always(): the ratchet must run precisely when the step above failed.
      - name: Soft-spec ratchet (the pile may shrink, not grow)
        if: always() && steps.soft.outcome != 'skipped'
        run: npx tsx scripts/soft-spec-ratchet.ts soft-spec-results.json

      # Upload ALL diagnostics so any real failure is debuggable and no data is
      # lost: the HTML report + the raw trace/video/screenshot artifacts.
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: reality-check-report
          path: |
            playwright-report/
            test-results/
            tests/e2e/screenshots/
          retention-days: 14
          if-no-files-found: ignore
