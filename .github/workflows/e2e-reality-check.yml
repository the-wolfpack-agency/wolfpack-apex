name: E2E Reality Check

# Browser-level reality-check specs — the layer that would have caught the
# 2026-04-19 iframe-parity regression (commit 9097a47) that 400+ jest tests
# missed. Runs three specs:
#   1. sites-preview-reality-check — gate (must pass to merge)
#   2. sites-upload-reality-check  — continue-on-error until SMOKE creds
#                                    are wired into CI secrets
#   3. sites-designer-journey      — continue-on-error until SMOKE creds
#                                    are wired + SITES_SMOKE_PROJECT_ID set
#
# Gate promotion: flip `continue-on-error` to `false` once the creds are
# in repo secrets. Track in next handoff.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: e2e-reality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  reality-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI: "true"
      PROD_URL: ${{ secrets.PROD_URL }}
      SMOKE_TEST_EMAIL: ${{ secrets.SMOKE_TEST_EMAIL }}
      SMOKE_TEST_PASSWORD: ${{ secrets.SMOKE_TEST_PASSWORD }}
      SITES_SMOKE_PROJECT_ID: ${{ secrets.SITES_SMOKE_PROJECT_ID }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
      - run: npm ci
      - run: npx playwright install --with-deps chromium

      # Gate — must pass. Parity regression = merge blocked.
      - name: Preview parity spec (gate)
        run: npx playwright test tests/e2e/sites-preview-reality-check.spec.ts --config=playwright.config.ts --reporter=github

      # Soft gates until creds land. Still surface failures in the run
      # log so we can watch them mature.
      - name: Upload reality spec (soft)
        continue-on-error: true
        run: npx playwright test tests/e2e/sites-upload-reality-check.spec.ts --config=playwright.config.ts --reporter=github

      - name: Designer journey spec (soft)
        continue-on-error: true
        run: npx playwright test tests/e2e/sites-designer-journey.spec.ts --config=playwright.config.ts --reporter=github

      # Real DB round-trip for the first Tier-4-renamed table.
      # POSTs a feature-request through the API and independently GETs
      # it back — the only test layer that can detect a silent-
      # discard bug where a 200 response coexists with data that never
      # landed. Soft gate until smoke creds are in secrets; becomes a
      # hard gate the moment they are.
      - name: Feature-requests data-flow spec (soft)
        continue-on-error: true
        run: npx playwright test tests/e2e/feature-requests-data-flow.spec.ts --config=playwright.config.ts --reporter=github

      # Real-browser specs for /emails /messages /dashboard /search.
      # These cover regressions jsdom missed: layout/wrap, focus,
      # computed styles, IntersectionObserver / scroll. Soft gate
      # until creds are in secrets; promote to hard gate after a few
      # green runs.
      - name: Search autofocus spec (soft)
        continue-on-error: true
        run: npx playwright test tests/e2e/search-autofocus.spec.ts --config=playwright.config.ts --reporter=github

      # Promoted to hard gate after the per-position testid fix —
      # tests now pin every tile by its rendered index, so a regression
      # that re-introduces a shared testid (or drops a tile) will fail
      # the suite.
      - name: Dashboard quick-actions spec (gate)
        continue-on-error: false
        run: npx playwright test tests/e2e/dashboard-quick-actions.spec.ts --config=playwright.config.ts --reporter=github

      # Emails inbox flow — HARD GATE. Locks in the Gmail-style 3-
      # column shell (inbox + nav rail stay mounted while a thread
      # is open), pane mutual exclusion, layout geometry, the
      # styled UnsavedDraftDialog regression guard, and the mobile
      # carve-out where the reader takes full width. Promoted from
      # soft to hard because the page-root reader-takeover bug
      # (fix/emails-reader-stays-in-right-pane) was exactly the
      # kind of regression jsdom unit tests cannot catch.
      - name: Emails inbox flow spec (gate)
        run: npx playwright test tests/e2e/emails-inbox-flow.spec.ts --config=playwright.config.ts --reporter=github

      - name: Messages bug-fix spec (soft)
        continue-on-error: true
        run: npx playwright test tests/e2e/messages-bugs.spec.ts --config=playwright.config.ts --reporter=github

      # Knowledge semantic Q&A cache + LLM fallback (migration 108).
      # Soft gate while we wait for the embed key in CI; promote once
      # OPENAI_API_KEY + a primed knowledge_qa_entries table are
      # reliably available against the smoke target.
      - name: Knowledge Q&A cache spec (soft)
        continue-on-error: true
        run: npx playwright test tests/e2e/knowledge-qa-cache.spec.ts --config=playwright.config.ts --reporter=github


      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reality-check-report
          path: |
            playwright-report/
            tests/e2e/screenshots/
          retention-days: 14
          if-no-files-found: ignore
