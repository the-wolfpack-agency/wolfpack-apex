# Walk a deployment's first day and report what a person actually gets.
#
# WHY THIS IS ON DEMAND AND NOT ON EVERY PUSH. It types real questions into a
# real deployment, which spends model tokens and writes conversation rows. It
# runs when somebody is standing an instance up or checking one before a
# walkthrough, which is exactly when the answer matters.
#
# POINT IT AT A CLIENT DEPLOYMENT: Actions -> Deployment journey -> Run
# workflow, and set `url` to their instance. Defaults to ours.
#
# WHAT IT CATCHES THAT CI CANNOT. Unit tests run against fixtures and health
# probes prove a connector responds. Neither can see a healthy stack that still
# hands somebody the wrong thing. On its first run, 2026-08-29, it caught the
# onboarding's own "ask our documents" prompt returning a tour of the Docs page
# while SharePoint was connected, search worked, and the same question phrased
# naturally answered with a citation in 1.8 seconds.

name: Deployment journey

# LEAST PRIVILEGE BY DEFAULT, flagged by CodeQL (TokenPermissionsID, high).
# Without a top-level block every job inherits the repository default, which
# can be write. A workflow that only reads code should not hold a token that
# can push to it: the blast radius of a compromised action is whatever the
# token could do, not whatever the workflow meant to do.
# A job needing more elevates explicitly, so the grant is visible where it is
# used rather than assumed everywhere.
permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      url:
        description: "Deployment to walk (e.g. https://client.vercel.app)"
        required: true
        default: "https://wolfpack-instinct.vercel.app"
      document:
        # A document in THEIR corpus, named as somebody would say it. Without
        # it the multi-turn scenarios run only their portable half, and say so.
        description: 'A document in this deployment, e.g. "the master services agreement"'
        required: false
        default: ""
      contains:
        description: 'A distinctive string that document contains, e.g. "30 days"'
        required: false
        default: ""
      probes:
        # Questions THIS deployment's own documents can answer. Without them the
        # run proves the product responds, refuses cleanly and does not
        # confabulate, and proves nothing about their corpus — which it says.
        description: 'Questions their documents answer, as JSON: [{"ask":"what is our refund window?"}]'
        required: false
        default: ""
  schedule:
    # Weekly, so a deployment that quietly stops answering is noticed by
    # something other than a client.
    - cron: "0 7 * * 1"

jobs:
  journey:
    name: first day on the deployment
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v4.0.4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium

      - name: Walk the first day
        env:
          PROD_URL: ${{ github.event.inputs.url || 'https://wolfpack-instinct.vercel.app' }}
          JOURNEY_EMAIL: ${{ secrets.ADMIN_E2E_EMAIL }}
          JOURNEY_PASSWORD: ${{ secrets.ADMIN_E2E_PASSWORD }}
          JOURNEY_PROBES: ${{ github.event.inputs.probes }}
        # Workers 1: the report is about one deployment, not about parallel
        # load, and the steps share one account.
        run: npx playwright test tests/e2e/first-day-journey.spec.ts --workers=1 --reporter=line

      - name: Walk whole jobs, not single questions
        # Separate step so a failure here is reported as "a job broke" rather
        # than folded into the single-question results. They answer different
        # questions and a client cares about the second one.
        env:
          PROD_URL: ${{ github.event.inputs.url || 'https://wolfpack-instinct.vercel.app' }}
          JOURNEY_EMAIL: ${{ secrets.ADMIN_E2E_EMAIL }}
          JOURNEY_PASSWORD: ${{ secrets.ADMIN_E2E_PASSWORD }}
          SCENARIO_DOCUMENT: ${{ github.event.inputs.document }}
          SCENARIO_CONTAINS: ${{ github.event.inputs.contains }}
        run: npx playwright test tests/e2e/scenarios.spec.ts --workers=1 --reporter=line
      - name: The welcome modal must not sit on top of the first answer
        # A first visit autofocuses the composer, so somebody can type past the
        # modal and get an answer underneath a backdrop that is still there.
        # Every control on that answer then silently does nothing. Only a real
        # browser can see it: hit-testing is the bug, and jsdom has no layout.
        env:
          PROD_URL: ${{ env.PROD_URL }}
          JOURNEY_EMAIL: ${{ secrets.ADMIN_E2E_EMAIL }}
          JOURNEY_PASSWORD: ${{ secrets.ADMIN_E2E_PASSWORD }}
        run: npx playwright test tests/e2e/welcome-modal-does-not-block-the-answer.spec.ts --workers=1 --reporter=line

      - name: Keep the evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: journey-evidence
          path: test-results/
          retention-days: 14
          if-no-files-found: ignore
