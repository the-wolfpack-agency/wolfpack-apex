name: Pipeline Self-Validation

# Validates the AgenticQA CI/CD pipeline ITSELF on this repo:
#   - Every workflow YAML parses cleanly
#   - Every script referenced in a workflow's `run:` step exists on disk
#   - Every AgenticQA-sourced script declared in the sync manifest is present
#   - Required Python tooling installs cleanly
#   - Required Node tooling installs cleanly
#
# Catches the failure mode where a workflow silently breaks because a
# script was renamed/moved or the manifest drifted. Complementary to
# agenticqa-full-pipeline.yml's Phase 0 Health Check (which only does
# YAML parse validation).
#
# Runs weekly Sunday 02:00 UTC + manual dispatch.

on:
  schedule:
    - cron: '0 2 * * 0'
  workflow_dispatch:
    inputs:
      open_issue_on_failure:
        description: 'Open GitHub issue on validation failure'
        required: false
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'

permissions:
  contents: read
  issues: write

jobs:
  validate-workflows:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    name: Validate all workflow YAMLs
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install pyyaml
        run: pip install -q pyyaml
      - name: Parse every .github/workflows/*.yml
        run: |
          FAIL=0
          for f in .github/workflows/*.yml; do
            if python3 -c "import yaml,sys; yaml.safe_load(open(sys.argv[1]))" "$f" 2>/dev/null; then
              echo "  ok: $f"
            else
              echo "::error file=$f::YAML parse failed"
              FAIL=1
            fi
          done
          [ "$FAIL" -eq 0 ] || exit 1

  validate-script-references:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    name: Verify every script referenced by a workflow exists
    steps:
      - uses: actions/checkout@v4
      - name: Extract + verify script paths
        run: |
          # Pull every `python3 scripts/...py` and `python scripts/...py`
          # reference out of workflows, plus every `scripts/...sh`.
          REFS=$(grep -rohE "(python3?|bash) +scripts/[a-zA-Z0-9_./-]+\.(py|sh)" .github/workflows/ | awk '{print $NF}' | sort -u)
          FAIL=0
          for s in $REFS; do
            if [ -f "$s" ]; then
              echo "  ok: $s"
            else
              echo "::error::Workflow references missing script: $s"
              FAIL=1
            fi
          done
          [ "$FAIL" -eq 0 ] || exit 1

  validate-agenticqa-sync-manifest:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    name: AgenticQA-sourced scripts present on disk
    steps:
      - uses: actions/checkout@v4
      - name: Every manifest entry's dest file exists
        run: |
          if [ ! -f scripts/sync-from-agenticqa.sh ]; then
            echo "::warning::sync-from-agenticqa.sh not present; skipping manifest check"
            exit 0
          fi
          FAIL=0
          # Pull dest paths from the MANIFEST array (second field per line)
          awk '/MANIFEST=\(/,/\)/' scripts/sync-from-agenticqa.sh \
            | grep -E '^\s*"[^"]+\s+[^"]+"\s*$' \
            | sed -E 's/^\s*"[^ ]+\s+([^"]+)"\s*$/\1/' \
            | while read -r dst; do
              [ -z "$dst" ] && continue
              if [ -f "$dst" ]; then
                echo "  ok: $dst"
              else
                echo "::error::Manifest declares but missing: $dst"
                FAIL=1
              fi
            done
          [ "$FAIL" -eq 0 ] || exit 1

  validate-python-tooling:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    name: AgenticQA Python scripts parse + import cleanly
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: AST-parse every script
        run: |
          FAIL=0
          for f in scripts/*.py; do
            [ -f "$f" ] || continue
            if python3 -c "import ast,sys; ast.parse(open(sys.argv[1]).read())" "$f" 2>/dev/null; then
              echo "  ok: $f"
            else
              echo "::error file=$f::Python parse failed"
              FAIL=1
            fi
          done
          [ "$FAIL" -eq 0 ] || exit 1

  validate-node-tooling:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    name: npm ci installs and tsc still parses
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
        continue-on-error: true   # tsc failures already block in main pipeline; just report here

  summary:
    needs: [validate-workflows, validate-script-references, validate-agenticqa-sync-manifest, validate-python-tooling, validate-node-tooling]
    if: always()
    runs-on: ubuntu-latest
    name: Pipeline validation summary
    steps:
      - name: Aggregate
        run: |
          echo "## Pipeline Self-Validation Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Check | Result |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| Workflow YAML parse | ${{ needs.validate-workflows.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Script references | ${{ needs.validate-script-references.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Sync manifest files | ${{ needs.validate-agenticqa-sync-manifest.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Python tooling | ${{ needs.validate-python-tooling.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Node tooling | ${{ needs.validate-node-tooling.result }} |" >> $GITHUB_STEP_SUMMARY

      - name: Open issue if any check failed
        if: |
          (needs.validate-workflows.result == 'failure' ||
           needs.validate-script-references.result == 'failure' ||
           needs.validate-agenticqa-sync-manifest.result == 'failure' ||
           needs.validate-python-tooling.result == 'failure') &&
          (github.event_name == 'schedule' || github.event.inputs.open_issue_on_failure == 'true')
        uses: actions/github-script@v7
        with:
          script: |
            const title = `Pipeline self-validation failed — ${new Date().toISOString().slice(0,10)}`;
            const body = [
              '`pipeline-validation.yml` detected drift or breakage in the AgenticQA CI pipeline.',
              '',
              'Check results:',
              `- Workflow YAML parse: ${{ needs.validate-workflows.result }}`,
              `- Script references: ${{ needs.validate-script-references.result }}`,
              `- Sync manifest files: ${{ needs.validate-agenticqa-sync-manifest.result }}`,
              `- Python tooling: ${{ needs.validate-python-tooling.result }}`,
              `- Node tooling: ${{ needs.validate-node-tooling.result }}`,
              '',
              `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            ].join('\n');
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body,
              labels: ['pipeline-validation', 'ci-health'],
            });
