name: Pipeline Self-Validation

on:
  schedule:
    - cron: '0 2 * * 0'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    permissions:
      contents: read
      issues: write
    uses: the-wolfpack-agency/AgenticQA-core/.github/workflows/pipeline-validation.yml@664a57b1089a6d83061f01198dc7cd2d5fb7fbca # main
    with:
      severity: 'medium'
      fail_on_findings: 'false'
    secrets: inherit
