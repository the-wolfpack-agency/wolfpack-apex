name: AgenticQA Full Pipeline

# Runs the AgenticQA security scanner + standard quality gates against
# the Instinct codebase. Manual trigger only until the GitHub Actions
# minutes budget resets May 1.

on:
  workflow_dispatch:
    inputs:
      reason:
        description: 'Reason for manual trigger'
        required: false
        default: 'Manual pipeline trigger'

permissions:
  contents: write
  pull-requests: write
  security-events: write
  actions: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ──────────────────────────────────────────────────
  # Phase 0: Pipeline Health
  # ──────────────────────────────────────────────────

  pipeline-rescue:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    name: "Pipeline Health Check"
    steps:
      - uses: actions/checkout@v4
      - name: Validate workflow YAML
        run: |
          pip install pyyaml -q
          for file in .github/workflows/*.yml; do
            python3 -c "import yaml; yaml.safe_load(open('$file'))" && echo "ok: $file"
          done

  lint:
    needs: [pipeline-rescue]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    name: "Code Linting"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: TypeScript type-check
        run: npx tsc --noEmit
      - name: ESLint
        run: npx eslint .
        continue-on-error: true

  linting-fix:
    needs: [lint]
    if: always() && needs.lint.result != 'cancelled'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    name: "SRE Auto-Fix Linting"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: ESLint --fix
        run: npx eslint . --fix || true
      - name: Commit fixes if any
        run: |
          if ! git diff --quiet; then
            git config user.name "sre-agent[bot]"
            git config user.email "sre-agent[bot]@users.noreply.github.com"
            git add -A
            git commit -m "fix: auto-fix lint errors via AgenticQA SRE Agent" || true
            git push origin HEAD:${{ github.ref }} || true
          fi

  # ──────────────────────────────────────────────────
  # Phase 1: Tests + Security Scan (parallel)
  # ──────────────────────────────────────────────────

  phase-1-testing:
    needs: [linting-fix]
    if: always() && needs.linting-fix.result != 'cancelled'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    name: "Phase 1: Jest Test Suite"
    env:
      CI: true
      DATABASE_URL: ''
      APEX_JWT_SECRET: 'ci-test-secret-not-real'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Run Jest
        run: npx jest --no-coverage 2>&1 | tee jest-output.log
      - name: Strict TypeScript re-check
        run: npx tsc --noEmit
      - name: Upload test output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jest-results
          path: jest-output.log
          retention-days: 7

  agenticqa-security-scan:
    needs: [linting-fix]
    if: always() && needs.linting-fix.result != 'cancelled'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    name: "Phase 1: AgenticQA Security Scan"
    steps:
      - uses: actions/checkout@v4
      - name: Run AgenticQA scanner (13 scanners — prompt injection, bias, shadow AI, EU AI Act, etc.)
        id: scan
        uses: nhomyk/AgenticQA@main
        with:
          path: '.'
          fail-on-critical: 'false'
          sarif: 'true'
          pr-comment: 'true'
          github-token: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true
      - name: Upload SARIF to GitHub Code Scanning
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: agenticqa.sarif
        continue-on-error: true
      - name: Summarize scan results
        if: always()
        run: |
          echo "## AgenticQA Security Scan" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Metric | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Total findings | ${{ steps.scan.outputs.total-findings || 'N/A' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Critical findings | ${{ steps.scan.outputs.critical-findings || 'N/A' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Scanners OK | ${{ steps.scan.outputs.scanners-ok || 'N/A' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Risk level | ${{ steps.scan.outputs.risk-level || 'N/A' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Security grade | ${{ steps.scan.outputs.security-grade || 'N/A' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Detected languages | ${{ steps.scan.outputs.detected-languages || 'N/A' }} |" >> $GITHUB_STEP_SUMMARY

  shadow-verification:
    needs: [linting-fix]
    if: always() && needs.linting-fix.result != 'cancelled'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    name: "Phase 1: Shadow Mode Verification"
    env:
      CI: true
      DATABASE_URL: ''
      APEX_JWT_SECRET: 'ci-test-secret-not-real'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Cache Next.js build
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ hashFiles('src/**/*') }}
          restore-keys: |
            nextjs-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-
            nextjs-${{ runner.os }}-
      - name: Build (no DATABASE_URL — shadow mode)
        run: npm run build
      - name: Start server & verify routes don't 500
        run: |
          DATABASE_URL= npx next start -p 3099 &
          for i in {1..20}; do
            curl -sf http://localhost:3099/login -o /dev/null && break
            sleep 1
          done
          ROUTES=(
            "/login"
            "/api/auth/login"
            "/api/dashboard"
            "/api/analytics"
            "/api/analytics/insights"
            "/api/knowledge"
            "/api/journal"
            "/api/discussions"
            "/api/features"
            "/api/clients"
            "/api/docs"
            "/api/reports"
            "/api/emails"
            "/api/briefing"
            "/api/microsoft"
            "/api/quickbooks"
            "/api/integrations/plaud"
            "/api/meetings"
          )
          FAILURES=0
          for route in "${ROUTES[@]}"; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "http://localhost:3099${route}")
            if [ "$STATUS" = "500" ]; then
              echo "::error::500 on ${route}"
              FAILURES=$((FAILURES + 1))
            else
              echo "  ${route} -> ${STATUS}"
            fi
          done
          if [ $FAILURES -gt 0 ]; then
            echo "::error::${FAILURES} routes returned 500"
            exit 1
          fi

  # ──────────────────────────────────────────────────
  # Phase 1b: Lightweight agent analysis (no AgenticQA
  # node-script dependency — pure shell so it runs
  # against any project without modification)
  # ──────────────────────────────────────────────────

  sdet-analysis:
    needs: [phase-1-testing, agenticqa-security-scan]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    name: "Phase 1: SDET Analysis"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: jest-results
          path: ./jest-data
        continue-on-error: true
      - name: Test inventory & coverage gaps
        run: |
          echo "## SDET Analysis" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -f jest-data/jest-output.log ]; then
            SUITES=$(grep -oP "Test Suites:.*?(\d+) total" jest-data/jest-output.log | grep -oP "\d+ total" | grep -oP "\d+" || echo "0")
            TOTAL=$(grep -oP "Tests:.*?(\d+) total" jest-data/jest-output.log | grep -oP "\d+ total" | grep -oP "\d+" || echo "0")
            PASSED=$(grep -oP "Tests:.*?(\d+) passed" jest-data/jest-output.log | grep -oP "\d+ passed" | grep -oP "\d+" || echo "0")
            echo "| Metric | Value |" >> $GITHUB_STEP_SUMMARY
            echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
            echo "| Test suites | ${SUITES} |" >> $GITHUB_STEP_SUMMARY
            echo "| Tests total | ${TOTAL} |" >> $GITHUB_STEP_SUMMARY
            echo "| Tests passed | ${PASSED} |" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Surface inventory" >> $GITHUB_STEP_SUMMARY
          API_ROUTES=$(find src/app/api -name "route.ts" 2>/dev/null | wc -l || echo "0")
          PAGES=$(find "src/app/(dashboard)" -name "page.tsx" 2>/dev/null | wc -l || echo "0")
          LIB_FILES=$(find src/lib -name "*.ts" -not -path "*/__tests__/*" 2>/dev/null | wc -l || echo "0")
          TEST_FILES=$(find src/lib/__tests__ -name "*.test.ts" 2>/dev/null | wc -l || echo "0")
          echo "| Asset | Count |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| API routes | ${API_ROUTES} |" >> $GITHUB_STEP_SUMMARY
          echo "| Dashboard pages | ${PAGES} |" >> $GITHUB_STEP_SUMMARY
          echo "| Lib modules | ${LIB_FILES} |" >> $GITHUB_STEP_SUMMARY
          echo "| Test files | ${TEST_FILES} |" >> $GITHUB_STEP_SUMMARY

  compliance-analysis:
    needs: [phase-1-testing, agenticqa-security-scan]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    name: "Phase 1: Compliance Analysis"
    steps:
      - uses: actions/checkout@v4
      - name: Compliance + privacy posture
        run: |
          echo "## Compliance Analysis" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Security headers" >> $GITHUB_STEP_SUMMARY
          for header in "X-Frame-Options" "X-Content-Type-Options" "Strict-Transport-Security" "Content-Security-Policy"; do
            if grep -rq "$header" src/ next.config.* 2>/dev/null; then
              echo "- ${header}: configured" >> $GITHUB_STEP_SUMMARY
            else
              echo "- ${header}: **missing**" >> $GITHUB_STEP_SUMMARY
            fi
          done
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### PII protection" >> $GITHUB_STEP_SUMMARY
          if find src/lib -name "doc-quality-gate.ts" 2>/dev/null | grep -q .; then
            echo "- Doc quality gate: present" >> $GITHUB_STEP_SUMMARY
          else
            echo "- Doc quality gate: **missing**" >> $GITHUB_STEP_SUMMARY
          fi
          ENCRYPT_REFS=$(grep -rln "createHmac\|timingSafeEqual\|encrypt\|cipher" src/ --include="*.ts" 2>/dev/null | wc -l || echo "0")
          echo "- Files using crypto/HMAC: ${ENCRYPT_REFS}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Secret exposure" >> $GITHUB_STEP_SUMMARY
          NEXT_PUBLIC_SECRETS=$(grep -rn "NEXT_PUBLIC.*SECRET\|NEXT_PUBLIC.*KEY\|NEXT_PUBLIC.*PASSWORD" src/ .env* 2>/dev/null | wc -l || echo "0")
          echo "- NEXT_PUBLIC_ secret leaks: ${NEXT_PUBLIC_SECRETS}" >> $GITHUB_STEP_SUMMARY
          [ "$NEXT_PUBLIC_SECRETS" -gt 0 ] && echo "::warning::Potential secret exposure via NEXT_PUBLIC_"
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Per-user token isolation" >> $GITHUB_STEP_SUMMARY
          NO_USER_SCOPE=$(grep -rln "FROM apex_ms_tokens" src/lib --include="*.ts" 2>/dev/null | xargs grep -L "WHERE connected_by" 2>/dev/null | wc -l || echo "0")
          if [ "$NO_USER_SCOPE" -gt 0 ]; then
            echo "::warning::${NO_USER_SCOPE} apex_ms_tokens query without user scoping (regression of c96129d)"
            echo "- **${NO_USER_SCOPE}** unscoped queries — possible regression" >> $GITHUB_STEP_SUMMARY
          else
            echo "- All apex_ms_tokens queries scoped by connected_by" >> $GITHUB_STEP_SUMMARY
          fi

  # ──────────────────────────────────────────────────
  # Phase 2: Fullstack verification (build still works)
  # ──────────────────────────────────────────────────

  fullstack-verification:
    needs: [sdet-analysis, compliance-analysis, shadow-verification]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 15
    name: "Phase 2: Fullstack Build Verification"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Production build still works after Phase 1 fixes
        run: |
          echo "## Fullstack Build Verification" >> $GITHUB_STEP_SUMMARY
          if DATABASE_URL= npm run build 2>&1; then
            echo "- Production build: PASS" >> $GITHUB_STEP_SUMMARY
          else
            echo "- Production build: **FAIL**" >> $GITHUB_STEP_SUMMARY
            echo "::error::Production build failed"
            exit 1
          fi

  # ──────────────────────────────────────────────────
  # Phase 3: SRE production readiness
  # ──────────────────────────────────────────────────

  sre-readiness:
    needs: [fullstack-verification]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    name: "Phase 3: SRE Production Readiness"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Production hygiene checks
        run: |
          echo "## SRE Production Readiness" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Dependency security" >> $GITHUB_STEP_SUMMARY
          AUDIT=$(npm audit --production 2>&1 || true)
          VULN=$(echo "$AUDIT" | grep -c "vulnerability" || echo "0")
          echo "- npm audit references: ${VULN}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Code hygiene" >> $GITHUB_STEP_SUMMARY
          CONSOLE=$(grep -rn "console\.log" src/ --include="*.ts" --include="*.tsx" 2>/dev/null | grep -v "// debug\|// TODO\|test\|spec" | wc -l || echo "0")
          echo "- console.log in src/: ${CONSOLE}" >> $GITHUB_STEP_SUMMARY
          ENV_VARS=$(grep -roh 'process\.env\.\w*' src/ 2>/dev/null | sort -u | wc -l || echo "0")
          echo "- Distinct env vars used: ${ENV_VARS}" >> $GITHUB_STEP_SUMMARY
          MIGRATIONS=$(ls src/db/migrations/*.sql 2>/dev/null | wc -l || echo "0")
          echo "- Database migrations: ${MIGRATIONS}" >> $GITHUB_STEP_SUMMARY

  # ──────────────────────────────────────────────────
  # Final summary
  # ──────────────────────────────────────────────────

  pipeline-summary:
    needs:
      - pipeline-rescue
      - lint
      - linting-fix
      - phase-1-testing
      - agenticqa-security-scan
      - shadow-verification
      - sdet-analysis
      - compliance-analysis
      - fullstack-verification
      - sre-readiness
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    name: "Pipeline Summary"
    steps:
      - name: Generate summary
        run: |
          echo "## AgenticQA Full Pipeline — Wolfpack Instinct" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Phase | Job | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|-----|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| 0 | Pipeline Health | ${{ needs.pipeline-rescue.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 0 | Code Linting | ${{ needs.lint.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 0 | SRE Auto-Fix | ${{ needs.linting-fix.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 1 | Jest Test Suite | ${{ needs.phase-1-testing.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 1 | AgenticQA Security Scan | ${{ needs.agenticqa-security-scan.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 1 | Shadow Mode Verification | ${{ needs.shadow-verification.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 1 | SDET Analysis | ${{ needs.sdet-analysis.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 1 | Compliance Analysis | ${{ needs.compliance-analysis.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 2 | Fullstack Build Verification | ${{ needs.fullstack-verification.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 3 | SRE Readiness | ${{ needs.sre-readiness.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          FAILED=false
          for r in "${{ needs.lint.result }}" "${{ needs.phase-1-testing.result }}" "${{ needs.shadow-verification.result }}" "${{ needs.fullstack-verification.result }}"; do
            [ "$r" = "failure" ] && FAILED=true
          done
          if [ "$FAILED" = "true" ]; then
            echo "::error::Pipeline failed — do not deploy"
            echo "**RESULT: FAILED**" >> $GITHUB_STEP_SUMMARY
            exit 1
          fi
          echo "**RESULT: ALL GATES PASSED**" >> $GITHUB_STEP_SUMMARY
