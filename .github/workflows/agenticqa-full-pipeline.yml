name: AgenticQA Full Pipeline

# Composition of thin callers against reusable workflows in
# the-wolfpack-agency/AgenticQA-core.  Caller-specific jobs (the
# AgenticQA-orchestrator sidecar, shadow-mode route sweep, SRE production
# readiness, SRE auto-fix self-commit) stay inline; everything generic
# delegates upstream.

on:
  workflow_dispatch:
    inputs:
      reason:
        description: 'Reason for manual trigger'
        required: false
        default: 'Manual pipeline trigger'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ──────────────────────────────────────────────────
  # Phase 0: Pipeline Health
  # ──────────────────────────────────────────────────

  pipeline-rescue:
    name: "Pipeline Health Check"
    uses: the-wolfpack-agency/AgenticQA-core/.github/workflows/pipeline-health-check.yml@664a57b1089a6d83061f01198dc7cd2d5fb7fbca # main

  lint:
    needs: [pipeline-rescue]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    name: "Code Linting"
    # Stays inline: generic tsc + eslint, no value in wrapping.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v4.0.4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: TypeScript type-check
        run: npx tsc --noEmit
      - name: ESLint
        # Fails the job on lint errors (warnings still pass through).
        # Replaces prior continue-on-error:true that made lint
        # false-green: 15 errors + 146 warnings were not blocking CI.
        run: npm run lint

  linting-fix:
    needs: [lint]
    if: always() && needs.lint.result != 'cancelled'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    name: "SRE Auto-Fix Linting"
    permissions:
      contents: write
    # Stays inline: needs caller GITHUB_TOKEN to commit + push fixes back
    # to main.  Reusable workflows can't easily propagate that without
    # granting wider secrets:inherit which we don't want.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v4.0.4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: ESLint --fix
        run: npx eslint . --fix || true
      - name: Commit fixes if any
        run: |
          if ! git diff --quiet; then
            git config user.name "sre-agent[bot]"
            git config user.email "sre-agent[bot]@users.noreply.github.com"
            git add -A
            git commit -m "fix: auto-fix lint errors via AgenticQA SRE Agent" || true
            git push origin HEAD:${{ github.ref }} || true
          fi

  # ──────────────────────────────────────────────────
  # Phase 1: Tests + Orchestrator + Shadow (parallel)
  # ──────────────────────────────────────────────────

  phase-1-testing:
    needs: [linting-fix]
    if: always() && needs.linting-fix.result != 'cancelled'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    name: "Phase 1: Jest Test Suite (shard ${{ matrix.shard }}/4)"
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    env:
      CI: true
      DATABASE_URL: ''
      APEX_JWT_SECRET: 'ci-test-secret-not-real'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v4.0.4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Run Jest (shard ${{ matrix.shard }}/4)
        run: npx jest --no-coverage --shard=${{ matrix.shard }}/4 2>&1 | tee jest-output.log
      - name: Strict TypeScript re-check
        if: matrix.shard == 1
        run: npx tsc --noEmit
      - name: Upload test output
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: jest-results-shard-${{ matrix.shard }}
          path: jest-output.log
          retention-days: 7

  phase-1-playwright:
    needs: [linting-fix]
    if: always() && needs.linting-fix.result != 'cancelled'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    name: "Phase 1: Playwright E2E (shard ${{ matrix.shard }}/4)"
    # Mirrors wolfpack-auto's sharded Playwright pattern. wolfpack-apex uses
    # APEX_JWT_SECRET, not NextAuth — no NEXTAUTH_URL/SECRET required.
    # No `|| PLAYWRIGHT_FAILED=true` swallow: failures propagate honestly,
    # failure-artifact capture is gated by `if: failure()` instead.
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    env:
      CI: true
      DATABASE_URL: ''
      APEX_JWT_SECRET: 'ci-test-secret-not-real'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v6
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: playwright-${{ runner.os }}-
      # BROWSER BINARIES AND OS LIBRARIES ARE TWO DIFFERENT PROBLEMS, and
      # `--with-deps` did both in one step. The browsers come from the cache in
      # seconds; the libraries come from apt as root, and on 2026-08-19 the
      # runner's Azure apt mirror stopped answering, so the step spent its whole
      # ten minutes on `Ign:` retries and timed out with every browser already
      # in place. Split, the flaky half cannot hold the reliable half hostage.
      - name: Install Playwright browsers
        timeout-minutes: 8
        run: npx playwright install chromium
      # Only on a cache miss: the libraries change with the runner image, not
      # with our lockfile, and a warm cache means this runner has run these
      # tests before. Bounded, retried once, and a failure is a WARNING rather
      # than a stop: GitHub's ubuntu images already ship what chromium needs, so
      # the honest test of whether they are missing is the browser failing to
      # launch in the next step, which says so in one line. An apt mirror having
      # a bad afternoon is not a reason to block every pull request.
      - name: Install OS libraries for Chromium
        if: steps.pw-cache.outputs.cache-hit != 'true'
        timeout-minutes: 6
        run: |
          npx playwright install-deps chromium \
            || (echo "retrying once" && sleep 15 && npx playwright install-deps chromium) \
            || echo "::warning::playwright install-deps failed (apt mirror). Continuing: the GitHub runner image ships these libraries, and a genuinely missing one surfaces as a browser launch failure in the next step."


      - name: Cache Next.js build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v5
        with:
          path: .next/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ hashFiles('src/**/*') }}
          restore-keys: |
            nextjs-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-
            nextjs-${{ runner.os }}-

      - name: Build production bundle
        run: npm run build

      - name: Start production server
        run: |
          npm run start &
          for i in $(seq 1 15); do
            if curl -sf http://localhost:3000/ > /dev/null 2>&1; then
              echo "Server ready after $((i * 2))s"
              break
            fi
            sleep 2
          done

      - name: Run Playwright E2E tests (shard ${{ matrix.shard }}/4)
        id: playwright
        run: |
          set -o pipefail
          npx playwright test --project=chromium --workers=4 --shard=${{ matrix.shard }}/4 --reporter=github 2>&1 | tee playwright-output.log
          echo "status=completed" >> $GITHUB_OUTPUT

      - name: Capture failure artifacts
        if: failure() && steps.playwright.outcome == 'failure'
        run: |
          mkdir -p test-failures
          grep -i "error\|fail\|expected" playwright-output.log >> test-failures/playwright-errors.txt || true
          echo "PLAYWRIGHT_FAILED=true" >> test-failures/summary.txt

      - name: Upload test failures
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: playwright-failures-shard-${{ matrix.shard }}
          path: test-failures/
          retention-days: 7

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: playwright-results-shard-${{ matrix.shard }}
          path: |
            playwright-output.log
            test-results/
          retention-days: 7

  agenticqa-orchestrator:
    needs: [linting-fix]
    if: always() && needs.linting-fix.result != 'cancelled'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    name: "Phase 1: AgenticQA Orchestrator (full agent pipeline)"
    # ───────────────────────────────────────────────────────────────────
    # ARCHITECTURE
    #
    # AgenticQA is a private user-owned repo (nhomyk/AgenticQA), so we
    # cannot consume it as a GitHub composite action from this org's
    # workflow (GitHub forbids cross-owner private action access).
    #
    # Instead this job runs AgenticQA's FastAPI orchestrator AS A
    # SIDECAR for the duration of the run:
    #   1. Clones nhomyk/AgenticQA into ./agenticqa-src using a PAT secret
    #   2. Installs the package + uvicorn
    #   3. Boots `agent_api:app` on localhost:8765 in the background
    #   4. Waits for /health to return 200
    #   5. POSTs the Instinct repo URL to /api/workflows/requests
    #   6. Polls /api/workflows/requests/{id}/status until complete
    #   7. Renders results as a step summary
    #
    # No external infrastructure (no Railway, no Vercel hosting, no
    # GHCR image) — just a fresh boot every run. Slower per-run but
    # zero ops surface. Always uses the latest AgenticQA main.
    #
    # Required secret: AGENTICQA_REPO_PAT — a Personal Access Token
    # (classic, with `repo` scope) belonging to a user who has read
    # access to nhomyk/AgenticQA. If the secret is missing the job
    # gracefully skips with a warning so the pipeline stays green.
    # ───────────────────────────────────────────────────────────────────
    env:
      AGENTICQA_API: http://127.0.0.1:8765
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check if PAT is configured
        id: pat-check
        env:
          PAT: ${{ secrets.AGENTICQA_REPO_PAT }}
        run: |
          if [ -z "${PAT}" ]; then
            echo "configured=false" >> $GITHUB_OUTPUT
            echo "::warning::AGENTICQA_REPO_PAT secret is not set — the orchestrator job will skip. Set this in repo Settings → Secrets → Actions to enable the full AgenticQA agent pipeline."
          else
            echo "configured=true" >> $GITHUB_OUTPUT
          fi

      - name: Clone AgenticQA source
        if: steps.pat-check.outputs.configured == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: nhomyk/AgenticQA
          token: ${{ secrets.AGENTICQA_REPO_PAT }}
          path: agenticqa-src
          ref: main
          fetch-depth: 1

      - name: Set up Python
        if: steps.pat-check.outputs.configured == 'true'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'

      - name: Install AgenticQA dependencies
        if: steps.pat-check.outputs.configured == 'true'
        # The Python project lives in the AgenticQA/ subdirectory of the
        # nhomyk/AgenticQA repo, not at the repo root. The repo root has
        # the Dockerfile and the JS agents (sdet-agent.js etc.); the
        # FastAPI app and pyproject.toml are nested.
        working-directory: agenticqa-src/AgenticQA
        run: |
          python -m pip install --upgrade pip
          # Install the package itself (pulls in agents, RAG, etc.)
          pip install -e .
          # uvicorn for the FastAPI server
          pip install 'uvicorn[standard]'

      - name: Boot AgenticQA orchestrator (sidecar)
        id: boot
        if: steps.pat-check.outputs.configured == 'true'
        working-directory: agenticqa-src/AgenticQA
        env:
          AGENTICQA_AUTH_DISABLE: '1'
          PYTHONPATH: src:.
        run: |
          # Run uvicorn in background; logs go to /tmp for the summary step
          nohup python -m uvicorn agent_api:app \
            --host 127.0.0.1 \
            --port 8765 \
            --workers 1 \
            > /tmp/agenticqa-server.log 2>&1 &
          echo $! > /tmp/agenticqa-server.pid
          # Wait for /health to come up (up to 60s — large module set, slow boot)
          for i in $(seq 1 60); do
            STATUS=$(curl -sS -o /dev/null -w "%{http_code}" --max-time 2 "${AGENTICQA_API}/health" 2>/dev/null || echo "000")
            if [ "$STATUS" = "200" ]; then
              echo "Sidecar healthy after ${i}s"
              echo "ready=true" >> $GITHUB_OUTPUT
              exit 0
            fi
            sleep 1
          done
          echo "::error::AgenticQA sidecar failed to come up within 60s"
          echo "ready=false" >> $GITHUB_OUTPUT
          echo "--- last 60 lines of server log ---"
          tail -60 /tmp/agenticqa-server.log || true
          exit 1

      - name: Submit full pipeline workflow request
        id: submit
        if: steps.boot.outputs.ready == 'true'
        run: |
          # Build the request body. Pass the LOCAL filesystem path of
          # the Instinct checkout (already cloned by the first
          # actions/checkout step) — the AgenticQA worker resolves
          # `repo` as a local path, not a git URL. Using GITHUB_WORKSPACE
          # is the canonical "where this repo lives on the runner".
          INSTINCT_PATH="${GITHUB_WORKSPACE}"
          python3 -c "
          import json
          body = {
              'prompt': 'Run full pipeline against this repository — SDET, Fullstack, SRE, Compliance, Security',
              'repo': '${INSTINCT_PATH}',
              'requester': 'instinct-ci',
              'metadata': {
                  'commit_sha': '${{ github.sha }}',
                  'run_id': '${{ github.run_id }}',
                  'branch': '${{ github.ref_name }}',
                  'github_url': 'https://github.com/the-wolfpack-agency/wolfpack-apex',
              },
          }
          with open('/tmp/submit-body.json', 'w') as f:
              json.dump(body, f)
          "
          # POST. The API returns:
          #   { success: bool, request: { id, status, plan, ... } }
          curl -sS -X POST "${AGENTICQA_API}/api/workflows/requests" \
            -H "Content-Type: application/json" \
            -d @/tmp/submit-body.json > /tmp/workflow-submit.json
          echo "--- raw response ---"
          cat /tmp/workflow-submit.json
          echo
          # Extract the nested id from request.id
          REQUEST_ID=$(python3 -c "
          import json
          try:
              d = json.load(open('/tmp/workflow-submit.json'))
              # Response shape: {success, timestamp, request: {id, status, ...}}
              req = d.get('request') or {}
              print(req.get('id') or d.get('request_id') or d.get('id') or '')
          except Exception as e:
              print(f'extract_failed: {e}')
          " 2>/dev/null || echo "")
          echo "request_id=${REQUEST_ID}" >> $GITHUB_OUTPUT
          if [ -z "${REQUEST_ID}" ] || [[ "${REQUEST_ID}" == extract_failed* ]]; then
            echo "::warning::Could not extract request_id from response"
            exit 0
          fi
          # The orchestrator gates execution behind manual approval by
          # default. CI auto-approves so the agents actually run.
          echo "Auto-approving workflow request ${REQUEST_ID}..."
          curl -sS -X POST "${AGENTICQA_API}/api/workflows/requests/${REQUEST_ID}/approve" \
            -H "Content-Type: application/json" \
            -d '{"requester":"instinct-ci","reason":"CI auto-approve"}' \
            > /tmp/approve-resp.json 2>&1 || true
          echo "--- approve response ---"
          cat /tmp/approve-resp.json
          echo
          # Queue the approved workflow for execution
          echo "Queueing workflow request ${REQUEST_ID}..."
          curl -sS -X POST "${AGENTICQA_API}/api/workflows/requests/${REQUEST_ID}/queue" \
            -H "Content-Type: application/json" \
            -d '{"requester":"instinct-ci"}' \
            > /tmp/queue-resp.json 2>&1 || true
          echo "--- queue response ---"
          cat /tmp/queue-resp.json
          echo
          # Run the worker to actually execute the next item in the queue
          echo "Running worker for request ${REQUEST_ID}..."
          curl -sS -X POST "${AGENTICQA_API}/api/workflows/worker/run/${REQUEST_ID}" \
            -H "Content-Type: application/json" \
            -d '{"dry_run":false,"open_pr":false}' \
            > /tmp/run-resp.json 2>&1 || true
          echo "--- worker run response ---"
          cat /tmp/run-resp.json

      - name: Poll workflow until complete
        id: poll
        if: steps.boot.outputs.ready == 'true' && steps.submit.outputs.request_id != ''
        run: |
          REQUEST_ID="${{ steps.submit.outputs.request_id }}"
          for i in $(seq 1 60); do
            sleep 10
            curl -sS "${AGENTICQA_API}/api/workflows/requests/${REQUEST_ID}/status" > /tmp/status.json 2>/dev/null || true
            STATE=$(python3 -c "
          import json
          try:
              d = json.load(open('/tmp/status.json'))
              # status may be at the top level or nested under 'request'
              s = d.get('status') or (d.get('request') or {}).get('status')
              print(s or 'unknown')
          except Exception:
              print('unknown')
          " 2>/dev/null || echo "unknown")
            echo "[poll ${i}/60] status=${STATE}"
            case "$STATE" in
              COMPLETED|completed|SUCCEEDED|succeeded|FAILED|failed|ERROR|error)
                echo "final_status=${STATE}" >> $GITHUB_OUTPUT
                break
                ;;
            esac
          done

      - name: Render orchestrator summary
        if: always()
        run: |
          echo "## AgenticQA Orchestrator" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "${{ steps.pat-check.outputs.configured }}" != "true" ]; then
            echo "**Status:** Skipped — AGENTICQA_REPO_PAT secret not configured" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "To enable the full AgenticQA agent pipeline:" >> $GITHUB_STEP_SUMMARY
            echo "1. Create a Personal Access Token (classic) with \`repo\` scope at https://github.com/settings/tokens" >> $GITHUB_STEP_SUMMARY
            echo "2. Add it as the secret \`AGENTICQA_REPO_PAT\` in this repo's Settings → Secrets and variables → Actions" >> $GITHUB_STEP_SUMMARY
            echo "3. Re-run this workflow" >> $GITHUB_STEP_SUMMARY
          elif [ "${{ steps.boot.outputs.ready }}" != "true" ]; then
            echo "**Status:** Sidecar failed to boot" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "<details><summary>Server log (last 60 lines)</summary>" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            tail -60 /tmp/agenticqa-server.log 2>/dev/null || echo "(no log)" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            echo "</details>" >> $GITHUB_STEP_SUMMARY
          else
            echo "**Status:** Sidecar healthy, workflow submitted" >> $GITHUB_STEP_SUMMARY
            echo "**Request ID:** ${{ steps.submit.outputs.request_id }}" >> $GITHUB_STEP_SUMMARY
            echo "**Final status:** ${{ steps.poll.outputs.final_status }}" >> $GITHUB_STEP_SUMMARY
            if [ -f /tmp/status.json ]; then
              echo "" >> $GITHUB_STEP_SUMMARY
              echo "<details><summary>Full agent response</summary>" >> $GITHUB_STEP_SUMMARY
              echo "" >> $GITHUB_STEP_SUMMARY
              echo '```json' >> $GITHUB_STEP_SUMMARY
              cat /tmp/status.json >> $GITHUB_STEP_SUMMARY
              echo '```' >> $GITHUB_STEP_SUMMARY
              echo "</details>" >> $GITHUB_STEP_SUMMARY
            fi
          fi
        continue-on-error: true

      - name: Stop sidecar
        if: always()
        run: |
          if [ -f /tmp/agenticqa-server.pid ]; then
            kill $(cat /tmp/agenticqa-server.pid) 2>/dev/null || true
          fi

  shadow-verification:
    needs: [linting-fix]
    if: always() && needs.linting-fix.result != 'cancelled'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    name: "Phase 1: Shadow Mode Verification"
    # Stays inline: routes swept here are wolfpack-apex-specific
    # (/api/dashboard, /api/journal, /api/microsoft, …) and the build
    # uses APEX_JWT_SECRET rather than NEXTAUTH_SECRET.
    env:
      CI: true
      DATABASE_URL: ''
      APEX_JWT_SECRET: 'ci-test-secret-not-real'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v4.0.4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Cache Next.js build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v5
        with:
          path: .next/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ hashFiles('src/**/*') }}
          restore-keys: |
            nextjs-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-
            nextjs-${{ runner.os }}-
      - name: Build (no DATABASE_URL — shadow mode)
        run: npm run build
      - name: Start server & verify routes don't 500
        run: |
          DATABASE_URL= npx next start -p 3099 &
          for i in {1..20}; do
            curl -sf http://localhost:3099/login -o /dev/null && break
            sleep 1
          done
          ROUTES=(
            "/login"
            "/api/auth/login"
            "/api/dashboard"
            "/api/analytics"
            "/api/analytics/insights"
            "/api/knowledge"
            "/api/journal"
            "/api/discussions"
            "/api/features"
            "/api/clients"
            "/api/docs"
            "/api/reports"
            "/api/emails"
            "/api/briefing"
            "/api/microsoft"
            "/api/quickbooks"
            "/api/integrations/plaud"
            "/api/meetings"
          )
          FAILURES=0
          for route in "${ROUTES[@]}"; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "http://localhost:3099${route}")
            if [ "$STATUS" = "500" ]; then
              echo "::error::500 on ${route}"
              FAILURES=$((FAILURES + 1))
            else
              echo "  ${route} -> ${STATUS}"
            fi
          done
          if [ $FAILURES -gt 0 ]; then
            echo "::error::${FAILURES} routes returned 500"
            exit 1
          fi

  # ──────────────────────────────────────────────────
  # Phase 1b: Agent analysis (thin callers — generic
  # noun-level signals against the wolfpack-apex tree)
  # ──────────────────────────────────────────────────

  sdet-analysis:
    needs: [phase-1-testing, agenticqa-orchestrator]
    if: always()
    name: "Phase 1: SDET Analysis"
    uses: the-wolfpack-agency/AgenticQA-core/.github/workflows/agent-sdet.yml@664a57b1089a6d83061f01198dc7cd2d5fb7fbca # main
    with:
      artifact_pattern: 'jest-results-shard-*'
      node_version: '22'
      run_npm_ci: false

  compliance-analysis:
    needs: [phase-1-testing, agenticqa-orchestrator]
    if: always()
    name: "Phase 1: Compliance Analysis"
    uses: the-wolfpack-agency/AgenticQA-core/.github/workflows/agent-compliance.yml@664a57b1089a6d83061f01198dc7cd2d5fb7fbca # main
    with:
      src_path: 'src/'

  # ──────────────────────────────────────────────────
  # Phase 2: Fullstack verification (build still works)
  # ──────────────────────────────────────────────────

  fullstack-verification:
    needs: [sdet-analysis, compliance-analysis, shadow-verification, phase-1-playwright]
    if: always()
    name: "Phase 2: Fullstack Build Verification"
    uses: the-wolfpack-agency/AgenticQA-core/.github/workflows/agent-fullstack.yml@664a57b1089a6d83061f01198dc7cd2d5fb7fbca # main
    with:
      artifact_pattern: 'jest-results-shard-*'
      verify_build: true
      node_version: '22'

  # ──────────────────────────────────────────────────
  # Phase 3: SRE production readiness
  # ──────────────────────────────────────────────────

  sre-readiness:
    needs: [fullstack-verification, phase-1-playwright]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    name: "Phase 3: SRE Production Readiness"
    # Stays inline: Next.js/npm-specific production-readiness checks
    # (.next bundle size, npm audit, src/ console.log hygiene, env-var
    # cataloging, migration count).  Generic version would lose those
    # signals.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v4.0.4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Production hygiene checks
        run: |
          echo "## SRE Production Readiness" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Dependency security" >> $GITHUB_STEP_SUMMARY
          AUDIT=$(npm audit --production 2>&1 || true)
          VULN=$(echo "$AUDIT" | grep -c "vulnerability" || echo "0")
          echo "- npm audit references: ${VULN}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Code hygiene" >> $GITHUB_STEP_SUMMARY
          CONSOLE=$(grep -rn "console\.log" src/ --include="*.ts" --include="*.tsx" 2>/dev/null | grep -v "// debug\|// TODO\|test\|spec" | wc -l || echo "0")
          echo "- console.log in src/: ${CONSOLE}" >> $GITHUB_STEP_SUMMARY
          ENV_VARS=$(grep -roh 'process\.env\.\w*' src/ 2>/dev/null | sort -u | wc -l || echo "0")
          echo "- Distinct env vars used: ${ENV_VARS}" >> $GITHUB_STEP_SUMMARY
          MIGRATIONS=$(ls src/db/migrations/*.sql 2>/dev/null | wc -l || echo "0")
          echo "- Database migrations: ${MIGRATIONS}" >> $GITHUB_STEP_SUMMARY

  # ──────────────────────────────────────────────────
  # Final summary
  # ──────────────────────────────────────────────────

  pipeline-summary:
    needs:
      - pipeline-rescue
      - lint
      - linting-fix
      - phase-1-testing
      - phase-1-playwright
      - agenticqa-orchestrator
      - shadow-verification
      - sdet-analysis
      - compliance-analysis
      - fullstack-verification
      - sre-readiness
    if: always()
    name: "Pipeline Summary"
    uses: the-wolfpack-agency/AgenticQA-core/.github/workflows/pipeline-summary.yml@664a57b1089a6d83061f01198dc7cd2d5fb7fbca # main
    with:
      pipeline_rescue_result: ${{ needs.pipeline-rescue.result }}
      lint_result: ${{ needs.lint.result }}
      linting_fix_result: ${{ needs.linting-fix.result }}
      phase_1_testing_result: ${{ needs.phase-1-testing.result }}
      phase_1_compliance_result: ${{ needs.agenticqa-orchestrator.result }}
      shadow_verification_result: ${{ needs.shadow-verification.result }}
      # Reusable pipeline-summary lacks a dedicated Playwright slot today;
      # repurpose the unused load_baseline_result so the E2E result is still
      # surfaced + gated. Update upstream if/when a phase_1_playwright_result
      # input is added.
      load_baseline_result: ${{ needs.phase-1-playwright.result }}
      sdet_agent_result: ${{ needs.sdet-analysis.result }}
      compliance_agent_result: ${{ needs.compliance-analysis.result }}
      fullstack_agent_result: ${{ needs.fullstack-verification.result }}
      sre_agent_result: ${{ needs.sre-readiness.result }}
      gating_jobs: 'lint,phase_1_testing,load_baseline,shadow_verification,fullstack_agent'
