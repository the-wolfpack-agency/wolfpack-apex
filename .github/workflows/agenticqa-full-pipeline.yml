name: AgenticQA Full Pipeline

# Runs the AgenticQA security scanner + standard quality gates against
# the Instinct codebase. Manual trigger only until the GitHub Actions
# minutes budget resets May 1.

on:
  workflow_dispatch:
    inputs:
      reason:
        description: 'Reason for manual trigger'
        required: false
        default: 'Manual pipeline trigger'

permissions:
  contents: write
  pull-requests: write
  security-events: write
  actions: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ──────────────────────────────────────────────────
  # Phase 0: Pipeline Health
  # ──────────────────────────────────────────────────

  pipeline-rescue:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    name: "Pipeline Health Check"
    steps:
      - uses: actions/checkout@v4
      - name: Validate workflow YAML
        run: |
          pip install pyyaml -q
          for file in .github/workflows/*.yml; do
            python3 -c "import yaml; yaml.safe_load(open('$file'))" && echo "ok: $file"
          done

  lint:
    needs: [pipeline-rescue]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    name: "Code Linting"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: TypeScript type-check
        run: npx tsc --noEmit
      - name: ESLint
        run: npx eslint .
        continue-on-error: true

  linting-fix:
    needs: [lint]
    if: always() && needs.lint.result != 'cancelled'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    name: "SRE Auto-Fix Linting"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: ESLint --fix
        run: npx eslint . --fix || true
      - name: Commit fixes if any
        run: |
          if ! git diff --quiet; then
            git config user.name "sre-agent[bot]"
            git config user.email "sre-agent[bot]@users.noreply.github.com"
            git add -A
            git commit -m "fix: auto-fix lint errors via AgenticQA SRE Agent" || true
            git push origin HEAD:${{ github.ref }} || true
          fi

  # ──────────────────────────────────────────────────
  # Phase 1: Tests + Security Scan (parallel)
  # ──────────────────────────────────────────────────

  phase-1-testing:
    needs: [linting-fix]
    if: always() && needs.linting-fix.result != 'cancelled'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    name: "Phase 1: Jest Test Suite"
    env:
      CI: true
      DATABASE_URL: ''
      APEX_JWT_SECRET: 'ci-test-secret-not-real'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Run Jest
        run: npx jest --no-coverage 2>&1 | tee jest-output.log
      - name: Strict TypeScript re-check
        run: npx tsc --noEmit
      - name: Upload test output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jest-results
          path: jest-output.log
          retention-days: 7

  agenticqa-orchestrator:
    needs: [linting-fix]
    if: always() && needs.linting-fix.result != 'cancelled'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    name: "Phase 1: AgenticQA Orchestrator (full agent pipeline)"
    # ───────────────────────────────────────────────────────────────────
    # ARCHITECTURE
    #
    # AgenticQA is a private user-owned repo (nhomyk/AgenticQA), so we
    # cannot consume it as a GitHub composite action from this org's
    # workflow (GitHub forbids cross-owner private action access).
    #
    # Instead this job runs AgenticQA's FastAPI orchestrator AS A
    # SIDECAR for the duration of the run:
    #   1. Clones nhomyk/AgenticQA into ./agenticqa-src using a PAT secret
    #   2. Installs the package + uvicorn
    #   3. Boots `agent_api:app` on localhost:8765 in the background
    #   4. Waits for /health to return 200
    #   5. POSTs the Instinct repo URL to /api/workflows/requests
    #   6. Polls /api/workflows/requests/{id}/status until complete
    #   7. Renders results as a step summary
    #
    # No external infrastructure (no Railway, no Vercel hosting, no
    # GHCR image) — just a fresh boot every run. Slower per-run but
    # zero ops surface. Always uses the latest AgenticQA main.
    #
    # Required secret: AGENTICQA_REPO_PAT — a Personal Access Token
    # (classic, with `repo` scope) belonging to a user who has read
    # access to nhomyk/AgenticQA. If the secret is missing the job
    # gracefully skips with a warning so the pipeline stays green.
    # ───────────────────────────────────────────────────────────────────
    env:
      AGENTICQA_API: http://127.0.0.1:8765
    steps:
      - uses: actions/checkout@v4

      - name: Check if PAT is configured
        id: pat-check
        env:
          PAT: ${{ secrets.AGENTICQA_REPO_PAT }}
        run: |
          if [ -z "${PAT}" ]; then
            echo "configured=false" >> $GITHUB_OUTPUT
            echo "::warning::AGENTICQA_REPO_PAT secret is not set — the orchestrator job will skip. Set this in repo Settings → Secrets → Actions to enable the full AgenticQA agent pipeline."
          else
            echo "configured=true" >> $GITHUB_OUTPUT
          fi

      - name: Clone AgenticQA source
        if: steps.pat-check.outputs.configured == 'true'
        uses: actions/checkout@v4
        with:
          repository: nhomyk/AgenticQA
          token: ${{ secrets.AGENTICQA_REPO_PAT }}
          path: agenticqa-src
          ref: main
          fetch-depth: 1

      - name: Set up Python
        if: steps.pat-check.outputs.configured == 'true'
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install AgenticQA dependencies
        if: steps.pat-check.outputs.configured == 'true'
        # The Python project lives in the AgenticQA/ subdirectory of the
        # nhomyk/AgenticQA repo, not at the repo root. The repo root has
        # the Dockerfile and the JS agents (sdet-agent.js etc.); the
        # FastAPI app and pyproject.toml are nested.
        working-directory: agenticqa-src/AgenticQA
        run: |
          python -m pip install --upgrade pip
          # Install the package itself (pulls in agents, RAG, etc.)
          pip install -e .
          # uvicorn for the FastAPI server
          pip install 'uvicorn[standard]'

      - name: Boot AgenticQA orchestrator (sidecar)
        id: boot
        if: steps.pat-check.outputs.configured == 'true'
        working-directory: agenticqa-src/AgenticQA
        env:
          AGENTICQA_AUTH_DISABLE: '1'
          PYTHONPATH: src:.
        run: |
          # Run uvicorn in background; logs go to /tmp for the summary step
          nohup python -m uvicorn agent_api:app \
            --host 127.0.0.1 \
            --port 8765 \
            --workers 1 \
            > /tmp/agenticqa-server.log 2>&1 &
          echo $! > /tmp/agenticqa-server.pid
          # Wait for /health to come up (up to 60s — large module set, slow boot)
          for i in $(seq 1 60); do
            STATUS=$(curl -sS -o /dev/null -w "%{http_code}" --max-time 2 "${AGENTICQA_API}/health" 2>/dev/null || echo "000")
            if [ "$STATUS" = "200" ]; then
              echo "Sidecar healthy after ${i}s"
              echo "ready=true" >> $GITHUB_OUTPUT
              exit 0
            fi
            sleep 1
          done
          echo "::error::AgenticQA sidecar failed to come up within 60s"
          echo "ready=false" >> $GITHUB_OUTPUT
          echo "--- last 60 lines of server log ---"
          tail -60 /tmp/agenticqa-server.log || true
          exit 1

      - name: Submit full pipeline workflow request
        id: submit
        if: steps.boot.outputs.ready == 'true'
        run: |
          # Build the request body. Pass the LOCAL filesystem path of
          # the Instinct checkout (already cloned by the first
          # actions/checkout step) — the AgenticQA worker resolves
          # `repo` as a local path, not a git URL. Using GITHUB_WORKSPACE
          # is the canonical "where this repo lives on the runner".
          INSTINCT_PATH="${GITHUB_WORKSPACE}"
          python3 -c "
          import json
          body = {
              'prompt': 'Run full pipeline against this repository — SDET, Fullstack, SRE, Compliance, Security',
              'repo': '${INSTINCT_PATH}',
              'requester': 'instinct-ci',
              'metadata': {
                  'commit_sha': '${{ github.sha }}',
                  'run_id': '${{ github.run_id }}',
                  'branch': '${{ github.ref_name }}',
                  'github_url': 'https://github.com/the-wolfpack-agency/wolfpack-apex',
              },
          }
          with open('/tmp/submit-body.json', 'w') as f:
              json.dump(body, f)
          "
          # POST. The API returns:
          #   { success: bool, request: { id, status, plan, ... } }
          curl -sS -X POST "${AGENTICQA_API}/api/workflows/requests" \
            -H "Content-Type: application/json" \
            -d @/tmp/submit-body.json > /tmp/workflow-submit.json
          echo "--- raw response ---"
          cat /tmp/workflow-submit.json
          echo
          # Extract the nested id from request.id
          REQUEST_ID=$(python3 -c "
          import json
          try:
              d = json.load(open('/tmp/workflow-submit.json'))
              # Response shape: {success, timestamp, request: {id, status, ...}}
              req = d.get('request') or {}
              print(req.get('id') or d.get('request_id') or d.get('id') or '')
          except Exception as e:
              print(f'extract_failed: {e}')
          " 2>/dev/null || echo "")
          echo "request_id=${REQUEST_ID}" >> $GITHUB_OUTPUT
          if [ -z "${REQUEST_ID}" ] || [[ "${REQUEST_ID}" == extract_failed* ]]; then
            echo "::warning::Could not extract request_id from response"
            exit 0
          fi
          # The orchestrator gates execution behind manual approval by
          # default. CI auto-approves so the agents actually run.
          echo "Auto-approving workflow request ${REQUEST_ID}..."
          curl -sS -X POST "${AGENTICQA_API}/api/workflows/requests/${REQUEST_ID}/approve" \
            -H "Content-Type: application/json" \
            -d '{"requester":"instinct-ci","reason":"CI auto-approve"}' \
            > /tmp/approve-resp.json 2>&1 || true
          echo "--- approve response ---"
          cat /tmp/approve-resp.json
          echo
          # Queue the approved workflow for execution
          echo "Queueing workflow request ${REQUEST_ID}..."
          curl -sS -X POST "${AGENTICQA_API}/api/workflows/requests/${REQUEST_ID}/queue" \
            -H "Content-Type: application/json" \
            -d '{"requester":"instinct-ci"}' \
            > /tmp/queue-resp.json 2>&1 || true
          echo "--- queue response ---"
          cat /tmp/queue-resp.json
          echo
          # Run the worker to actually execute the next item in the queue
          echo "Running worker for request ${REQUEST_ID}..."
          curl -sS -X POST "${AGENTICQA_API}/api/workflows/worker/run/${REQUEST_ID}" \
            -H "Content-Type: application/json" \
            -d '{"dry_run":false,"open_pr":false}' \
            > /tmp/run-resp.json 2>&1 || true
          echo "--- worker run response ---"
          cat /tmp/run-resp.json

      - name: Poll workflow until complete
        id: poll
        if: steps.boot.outputs.ready == 'true' && steps.submit.outputs.request_id != ''
        run: |
          REQUEST_ID="${{ steps.submit.outputs.request_id }}"
          for i in $(seq 1 60); do
            sleep 10
            curl -sS "${AGENTICQA_API}/api/workflows/requests/${REQUEST_ID}/status" > /tmp/status.json 2>/dev/null || true
            STATE=$(python3 -c "
          import json
          try:
              d = json.load(open('/tmp/status.json'))
              # status may be at the top level or nested under 'request'
              s = d.get('status') or (d.get('request') or {}).get('status')
              print(s or 'unknown')
          except Exception:
              print('unknown')
          " 2>/dev/null || echo "unknown")
            echo "[poll ${i}/60] status=${STATE}"
            case "$STATE" in
              COMPLETED|completed|SUCCEEDED|succeeded|FAILED|failed|ERROR|error)
                echo "final_status=${STATE}" >> $GITHUB_OUTPUT
                break
                ;;
            esac
          done

      - name: Render orchestrator summary
        if: always()
        run: |
          echo "## AgenticQA Orchestrator" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "${{ steps.pat-check.outputs.configured }}" != "true" ]; then
            echo "**Status:** Skipped — AGENTICQA_REPO_PAT secret not configured" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "To enable the full AgenticQA agent pipeline:" >> $GITHUB_STEP_SUMMARY
            echo "1. Create a Personal Access Token (classic) with \`repo\` scope at https://github.com/settings/tokens" >> $GITHUB_STEP_SUMMARY
            echo "2. Add it as the secret \`AGENTICQA_REPO_PAT\` in this repo's Settings → Secrets and variables → Actions" >> $GITHUB_STEP_SUMMARY
            echo "3. Re-run this workflow" >> $GITHUB_STEP_SUMMARY
          elif [ "${{ steps.boot.outputs.ready }}" != "true" ]; then
            echo "**Status:** Sidecar failed to boot" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "<details><summary>Server log (last 60 lines)</summary>" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            tail -60 /tmp/agenticqa-server.log 2>/dev/null || echo "(no log)" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            echo "</details>" >> $GITHUB_STEP_SUMMARY
          else
            echo "**Status:** Sidecar healthy, workflow submitted" >> $GITHUB_STEP_SUMMARY
            echo "**Request ID:** ${{ steps.submit.outputs.request_id }}" >> $GITHUB_STEP_SUMMARY
            echo "**Final status:** ${{ steps.poll.outputs.final_status }}" >> $GITHUB_STEP_SUMMARY
            if [ -f /tmp/status.json ]; then
              echo "" >> $GITHUB_STEP_SUMMARY
              echo "<details><summary>Full agent response</summary>" >> $GITHUB_STEP_SUMMARY
              echo "" >> $GITHUB_STEP_SUMMARY
              echo '```json' >> $GITHUB_STEP_SUMMARY
              cat /tmp/status.json >> $GITHUB_STEP_SUMMARY
              echo '```' >> $GITHUB_STEP_SUMMARY
              echo "</details>" >> $GITHUB_STEP_SUMMARY
            fi
          fi
        continue-on-error: true

      - name: Stop sidecar
        if: always()
        run: |
          if [ -f /tmp/agenticqa-server.pid ]; then
            kill $(cat /tmp/agenticqa-server.pid) 2>/dev/null || true
          fi

  shadow-verification:
    needs: [linting-fix]
    if: always() && needs.linting-fix.result != 'cancelled'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    name: "Phase 1: Shadow Mode Verification"
    env:
      CI: true
      DATABASE_URL: ''
      APEX_JWT_SECRET: 'ci-test-secret-not-real'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Cache Next.js build
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ hashFiles('src/**/*') }}
          restore-keys: |
            nextjs-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-
            nextjs-${{ runner.os }}-
      - name: Build (no DATABASE_URL — shadow mode)
        run: npm run build
      - name: Start server & verify routes don't 500
        run: |
          DATABASE_URL= npx next start -p 3099 &
          for i in {1..20}; do
            curl -sf http://localhost:3099/login -o /dev/null && break
            sleep 1
          done
          ROUTES=(
            "/login"
            "/api/auth/login"
            "/api/dashboard"
            "/api/analytics"
            "/api/analytics/insights"
            "/api/knowledge"
            "/api/journal"
            "/api/discussions"
            "/api/features"
            "/api/clients"
            "/api/docs"
            "/api/reports"
            "/api/emails"
            "/api/briefing"
            "/api/microsoft"
            "/api/quickbooks"
            "/api/integrations/plaud"
            "/api/meetings"
          )
          FAILURES=0
          for route in "${ROUTES[@]}"; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "http://localhost:3099${route}")
            if [ "$STATUS" = "500" ]; then
              echo "::error::500 on ${route}"
              FAILURES=$((FAILURES + 1))
            else
              echo "  ${route} -> ${STATUS}"
            fi
          done
          if [ $FAILURES -gt 0 ]; then
            echo "::error::${FAILURES} routes returned 500"
            exit 1
          fi

  # ──────────────────────────────────────────────────
  # Phase 1b: Lightweight agent analysis (no AgenticQA
  # node-script dependency — pure shell so it runs
  # against any project without modification)
  # ──────────────────────────────────────────────────

  sdet-analysis:
    needs: [phase-1-testing, agenticqa-orchestrator]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    name: "Phase 1: SDET Analysis"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: jest-results
          path: ./jest-data
        continue-on-error: true
      - name: Test inventory & coverage gaps
        run: |
          echo "## SDET Analysis" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -f jest-data/jest-output.log ]; then
            SUITES=$(grep -oP "Test Suites:.*?(\d+) total" jest-data/jest-output.log | grep -oP "\d+ total" | grep -oP "\d+" || echo "0")
            TOTAL=$(grep -oP "Tests:.*?(\d+) total" jest-data/jest-output.log | grep -oP "\d+ total" | grep -oP "\d+" || echo "0")
            PASSED=$(grep -oP "Tests:.*?(\d+) passed" jest-data/jest-output.log | grep -oP "\d+ passed" | grep -oP "\d+" || echo "0")
            echo "| Metric | Value |" >> $GITHUB_STEP_SUMMARY
            echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
            echo "| Test suites | ${SUITES} |" >> $GITHUB_STEP_SUMMARY
            echo "| Tests total | ${TOTAL} |" >> $GITHUB_STEP_SUMMARY
            echo "| Tests passed | ${PASSED} |" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Surface inventory" >> $GITHUB_STEP_SUMMARY
          API_ROUTES=$(find src/app/api -name "route.ts" 2>/dev/null | wc -l || echo "0")
          PAGES=$(find "src/app/(dashboard)" -name "page.tsx" 2>/dev/null | wc -l || echo "0")
          LIB_FILES=$(find src/lib -name "*.ts" -not -path "*/__tests__/*" 2>/dev/null | wc -l || echo "0")
          TEST_FILES=$(find src/lib/__tests__ -name "*.test.ts" 2>/dev/null | wc -l || echo "0")
          echo "| Asset | Count |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| API routes | ${API_ROUTES} |" >> $GITHUB_STEP_SUMMARY
          echo "| Dashboard pages | ${PAGES} |" >> $GITHUB_STEP_SUMMARY
          echo "| Lib modules | ${LIB_FILES} |" >> $GITHUB_STEP_SUMMARY
          echo "| Test files | ${TEST_FILES} |" >> $GITHUB_STEP_SUMMARY

  compliance-analysis:
    needs: [phase-1-testing, agenticqa-orchestrator]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    name: "Phase 1: Compliance Analysis"
    steps:
      - uses: actions/checkout@v4
      - name: Compliance + privacy posture
        run: |
          echo "## Compliance Analysis" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Security headers" >> $GITHUB_STEP_SUMMARY
          for header in "X-Frame-Options" "X-Content-Type-Options" "Strict-Transport-Security" "Content-Security-Policy"; do
            if grep -rq "$header" src/ next.config.* 2>/dev/null; then
              echo "- ${header}: configured" >> $GITHUB_STEP_SUMMARY
            else
              echo "- ${header}: **missing**" >> $GITHUB_STEP_SUMMARY
            fi
          done
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### PII protection" >> $GITHUB_STEP_SUMMARY
          if find src/lib -name "doc-quality-gate.ts" 2>/dev/null | grep -q .; then
            echo "- Doc quality gate: present" >> $GITHUB_STEP_SUMMARY
          else
            echo "- Doc quality gate: **missing**" >> $GITHUB_STEP_SUMMARY
          fi
          ENCRYPT_REFS=$(grep -rln "createHmac\|timingSafeEqual\|encrypt\|cipher" src/ --include="*.ts" 2>/dev/null | wc -l || echo "0")
          echo "- Files using crypto/HMAC: ${ENCRYPT_REFS}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Secret exposure" >> $GITHUB_STEP_SUMMARY
          NEXT_PUBLIC_SECRETS=$(grep -rn "NEXT_PUBLIC.*SECRET\|NEXT_PUBLIC.*KEY\|NEXT_PUBLIC.*PASSWORD" src/ .env* 2>/dev/null | wc -l || echo "0")
          echo "- NEXT_PUBLIC_ secret leaks: ${NEXT_PUBLIC_SECRETS}" >> $GITHUB_STEP_SUMMARY
          [ "$NEXT_PUBLIC_SECRETS" -gt 0 ] && echo "::warning::Potential secret exposure via NEXT_PUBLIC_"
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Per-user token isolation" >> $GITHUB_STEP_SUMMARY
          NO_USER_SCOPE=$(grep -rln "FROM apex_ms_tokens" src/lib --include="*.ts" 2>/dev/null | xargs grep -L "WHERE connected_by" 2>/dev/null | wc -l || echo "0")
          if [ "$NO_USER_SCOPE" -gt 0 ]; then
            echo "::warning::${NO_USER_SCOPE} apex_ms_tokens query without user scoping (regression of c96129d)"
            echo "- **${NO_USER_SCOPE}** unscoped queries — possible regression" >> $GITHUB_STEP_SUMMARY
          else
            echo "- All apex_ms_tokens queries scoped by connected_by" >> $GITHUB_STEP_SUMMARY
          fi

  # ──────────────────────────────────────────────────
  # Phase 2: Fullstack verification (build still works)
  # ──────────────────────────────────────────────────

  fullstack-verification:
    needs: [sdet-analysis, compliance-analysis, shadow-verification]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 15
    name: "Phase 2: Fullstack Build Verification"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Production build still works after Phase 1 fixes
        run: |
          echo "## Fullstack Build Verification" >> $GITHUB_STEP_SUMMARY
          if DATABASE_URL= npm run build 2>&1; then
            echo "- Production build: PASS" >> $GITHUB_STEP_SUMMARY
          else
            echo "- Production build: **FAIL**" >> $GITHUB_STEP_SUMMARY
            echo "::error::Production build failed"
            exit 1
          fi

  # ──────────────────────────────────────────────────
  # Phase 3: SRE production readiness
  # ──────────────────────────────────────────────────

  sre-readiness:
    needs: [fullstack-verification]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    name: "Phase 3: SRE Production Readiness"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Production hygiene checks
        run: |
          echo "## SRE Production Readiness" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Dependency security" >> $GITHUB_STEP_SUMMARY
          AUDIT=$(npm audit --production 2>&1 || true)
          VULN=$(echo "$AUDIT" | grep -c "vulnerability" || echo "0")
          echo "- npm audit references: ${VULN}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Code hygiene" >> $GITHUB_STEP_SUMMARY
          CONSOLE=$(grep -rn "console\.log" src/ --include="*.ts" --include="*.tsx" 2>/dev/null | grep -v "// debug\|// TODO\|test\|spec" | wc -l || echo "0")
          echo "- console.log in src/: ${CONSOLE}" >> $GITHUB_STEP_SUMMARY
          ENV_VARS=$(grep -roh 'process\.env\.\w*' src/ 2>/dev/null | sort -u | wc -l || echo "0")
          echo "- Distinct env vars used: ${ENV_VARS}" >> $GITHUB_STEP_SUMMARY
          MIGRATIONS=$(ls src/db/migrations/*.sql 2>/dev/null | wc -l || echo "0")
          echo "- Database migrations: ${MIGRATIONS}" >> $GITHUB_STEP_SUMMARY

  # ──────────────────────────────────────────────────
  # Final summary
  # ──────────────────────────────────────────────────

  pipeline-summary:
    needs:
      - pipeline-rescue
      - lint
      - linting-fix
      - phase-1-testing
      - agenticqa-orchestrator
      - shadow-verification
      - sdet-analysis
      - compliance-analysis
      - fullstack-verification
      - sre-readiness
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    name: "Pipeline Summary"
    steps:
      - name: Generate summary
        run: |
          echo "## AgenticQA Full Pipeline — Wolfpack Instinct" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Phase | Job | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|-----|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| 0 | Pipeline Health | ${{ needs.pipeline-rescue.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 0 | Code Linting | ${{ needs.lint.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 0 | SRE Auto-Fix | ${{ needs.linting-fix.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 1 | Jest Test Suite | ${{ needs.phase-1-testing.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 1 | AgenticQA Orchestrator | ${{ needs.agenticqa-orchestrator.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 1 | Shadow Mode Verification | ${{ needs.shadow-verification.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 1 | SDET Analysis | ${{ needs.sdet-analysis.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 1 | Compliance Analysis | ${{ needs.compliance-analysis.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 2 | Fullstack Build Verification | ${{ needs.fullstack-verification.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 3 | SRE Readiness | ${{ needs.sre-readiness.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          FAILED=false
          for r in "${{ needs.lint.result }}" "${{ needs.phase-1-testing.result }}" "${{ needs.shadow-verification.result }}" "${{ needs.fullstack-verification.result }}"; do
            [ "$r" = "failure" ] && FAILED=true
          done
          if [ "$FAILED" = "true" ]; then
            echo "::error::Pipeline failed — do not deploy"
            echo "**RESULT: FAILED**" >> $GITHUB_STEP_SUMMARY
            exit 1
          fi
          echo "**RESULT: ALL GATES PASSED**" >> $GITHUB_STEP_SUMMARY
