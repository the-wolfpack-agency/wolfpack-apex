# What we can reach in SharePoint that we have not connected.
#
# WHY IT RUNS HERE AND NOT AS A SCRIPT. Graph needs the Microsoft credentials,
# which live on the server. This calls the deployed route with CRON_SECRET, the
# same way the library repair sweep does.
#
# Asked 2026-09-02 and unanswerable at the time: are we connected to all of
# SharePoint? We held sources for two sites out of nine, one of which
# contributed ten documents because the source pointed three folders deep. On a
# client tenant that is the difference between answering from what they gave us
# and answering from a fraction of it, with no way for them to tell.
#
# IT CONNECTS NOTHING. It reports, for a person to act on.
name: SharePoint discovery
on:
  schedule:
    - cron: "35 7 * * *"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Ask what we can reach
        env:
          PROD_URL: ${{ secrets.PROD_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail
          # REFUSES rather than skipping. A job that reports nothing and exits
          # green is the defect this whole area keeps producing.
          if [ -z "${PROD_URL:-}" ] || [ -z "${CRON_SECRET:-}" ]; then
            echo "::error::PROD_URL and CRON_SECRET are required; without them this would verify nothing and pass."
            exit 1
          fi
          BODY=$(curl -sS --fail-with-body \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            "${PROD_URL%/}/api/admin/connectors/sharepoint/discover")
          echo "$BODY" | python3 -c 'import json,sys; [print("[discover]", l) for l in json.load(sys.stdin).get("lines", [])]'
          # An account that could not be asked makes the gap look smaller than
          # it is, so it fails the run rather than being a line nobody reads.
          echo "$BODY" | python3 -c '
import json,sys
d = json.load(sys.stdin)
blocked = d.get("couldNotAsk") or []
if blocked:
    for b in blocked:
        print(f"::error::Could not search as {b[\"email\"]}: {b[\"reason\"]}. The reported gap is incomplete.")
    sys.exit(1)
'
