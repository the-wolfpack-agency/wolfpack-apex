name: Security Governance

on:
  schedule:
    - cron: '30 9 * * 1'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  governance:
    permissions:
      contents: read
      issues: write
    uses: the-wolfpack-agency/AgenticQA-core/.github/workflows/security-governance.yml@664a57b1089a6d83061f01198dc7cd2d5fb7fbca # main
    with:
      repo: ${{ github.repository }}
      max_age_days: 90
    secrets: inherit
