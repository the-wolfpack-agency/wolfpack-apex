name: Tools Runner

run-name: "Tools: ${{ inputs.tool }} → ${{ inputs.target_url }}"

on:
  workflow_dispatch:
    inputs:
      tool:
        description: 'Tool to run'
        required: true
        type: choice
        options:
          - pdf-report
          - demo-deck
          - visual-diff
          - accessibility
      target_url:
        description: 'Target URL to scan'
        required: false
        default: 'https://wolfpack-instinct.vercel.app'
      paths:
        description: 'Comma-separated paths'
        required: false
        default: '/,/login,/sites,/security-posture'
      requester:
        description: 'User ID who triggered the run'
        required: false

permissions:
  contents: read

jobs:
  run-tool:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.11'

      - name: Install Chrome dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            libnss3 libatk1.0-0t64 libatk-bridge2.0-0t64 libcups2t64 \
            libxcomposite1 libxdamage1 libxrandr2 libgbm1 libpango-1.0-0 \
            libcairo2 libasound2t64 libxshmfence1 libxkbcommon0 \
            fonts-liberation xdg-utils 2>&1 || true

      - name: Install Vibium + Playwright fallback
        run: |
          pip install vibium playwright
          vibium install || true
          python -m playwright install chromium --with-deps

      - name: Run ${{ inputs.tool }}
        id: tool
        env:
          TOOL: ${{ inputs.tool }}
          TARGET_URL: ${{ inputs.target_url }}
          PATHS: ${{ inputs.paths }}
          DISPLAY: ":99"
        run: |
          mkdir -p /tmp/tool-results
          python3 scripts/tools-runner-exec.py
          cat /tmp/tool-results/result.json
          # Emit the result as a single-line base64 marker so the Vercel
          # /api/tools/status endpoint can parse it deterministically from
          # the job log. Base64 avoids all JSON-shape edge cases (nested
          # braces, embedded newlines, GH Actions timestamp prefixes).
          # The "TOOL_RESULT_B64=" marker is matched by tools-runner.ts.
          echo "TOOL_RESULT_B64=$(base64 -w0 < /tmp/tool-results/result.json)"
          # Also write to step output for workflow consumers.
          echo "result=$(cat /tmp/tool-results/result.json | jq -c .)" >> "$GITHUB_OUTPUT"

      - name: Upload results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: tool-results-${{ inputs.tool }}-${{ github.run_id }}
          path: /tmp/tool-results/
          retention-days: 7
          compression-level: 0
