name: Tools Runner

on:
  workflow_dispatch:
    inputs:
      tool:
        description: 'Tool to run'
        required: true
        type: choice
        options:
          - pdf-report
          - demo-deck
          - visual-diff
          - accessibility
      target_url:
        description: 'Target URL to scan'
        required: false
        default: 'https://wolfpack-instinct.vercel.app'
      paths:
        description: 'Comma-separated paths'
        required: false
        default: '/,/login,/sites,/security-posture'
      requester:
        description: 'User ID who triggered the run'
        required: false

permissions:
  contents: read
  actions: write

jobs:
  run-tool:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Chrome dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            libnss3 libatk1.0-0t64 libatk-bridge2.0-0t64 libcups2t64 \
            libxcomposite1 libxdamage1 libxrandr2 libgbm1 libpango-1.0-0 \
            libcairo2 libasound2t64 libxshmfence1 libxkbcommon0 \
            fonts-liberation xdg-utils 2>&1 || true

      - name: Install Vibium
        run: |
          pip install vibium
          vibium install

      - name: Run ${{ inputs.tool }}
        env:
          TOOL: ${{ inputs.tool }}
          TARGET_URL: ${{ inputs.target_url }}
          PATHS: ${{ inputs.paths }}
        run: |
          mkdir -p /tmp/tool-results
          python3 scripts/tools-runner-exec.py
          cat /tmp/tool-results/result.json

      - name: Upload results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tool-results-${{ inputs.tool }}-${{ github.run_id }}
          path: /tmp/tool-results/
          retention-days: 7
          compression-level: 0
