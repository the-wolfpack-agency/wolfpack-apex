# Run the SQL against a real Postgres.
#
# WHY THIS WORKFLOW EXISTS
#
# On 2026-08-03 every new invitee saw "An account already exists for this email."
# and could not create an account. A client was turned away. The cause was an
# `ON CONFLICT ON CONSTRAINT <name>` clause naming a unique INDEX on an
# expression, which Postgres can never treat as a table constraint.
#
# Every check in this repo passed. lint, tsc, ~13k unit tests, next build, and
# the deployed-URL smoke were all green, because the clause is valid TypeScript
# and a valid-looking string, and the unit tests mock `query` -- so they asserted
# that we sent the text we intended to send, which was the thing that was wrong.
# No job in this repo had ever run SQL against a database.
#
# This one does. A statement that references a constraint, column, index or
# table that does not exist fails here, and here is the only place it can fail
# before a user meets it.
#
# Tests named *.db.test.ts opt in: they skip without TEST_DATABASE_URL, so a
# local `npm test` is unchanged and this job is where they actually run.
name: DB contract

# LEAST PRIVILEGE BY DEFAULT, flagged by CodeQL (TokenPermissionsID, high).
# Without a top-level block every job inherits the repository default, which
# can be write. A workflow that only reads code should not hold a token that
# can push to it: the blast radius of a compromised action is whatever the
# token could do, not whatever the workflow meant to do.
# A job needing more elevates explicitly, so the grant is visible where it is
# used rather than assumed everywhere.
permissions:
  contents: read

on:
  pull_request:
  push:
    branches: [main]

jobs:
  db-contract:
    name: SQL against a real Postgres
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        # Pin the major to the version production runs on. A clause can be legal
        # in one major and not another, and this check is worthless if the
        # server disagrees with the one that will parse it for real.
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: instinct_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v4.0.4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # CAN A CLIENT ENVIRONMENT STILL BE BUILT FROM NOTHING?
      #
      # Deploying to a client means an empty database, and on 2026-08-27 the
      # chain could not fill one. It stopped three separate times: 125 seeded a
      # 'ceo' row against a constraint that does not permit it until 145, 129
      # asserted three seeded principles a new database does not have, and 137
      # added a foreign key to a workspace row that migration 015 never
      # inserts.
      #
      # Every existing deployment predates those files, so the chain had never
      # been replayed from zero and nothing was red. The product was one
      # onboarding away from discovering it in front of a client.
      #
      # Runs BEFORE the contract tests so a broken chain reports as a broken
      # chain, rather than as a hundred confusing test failures downstream.
      - name: A fresh database can be built from the migrations
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/fresh_install
        run: |
          set -euo pipefail
          PGPASSWORD=postgres psql -h localhost -U postgres -c 'CREATE DATABASE fresh_install;'
          npm run migrate

      # Runs against fresh_install, the database the step above just built.
      # The contract tests connect to instinct_test, which is NEVER migrated,
      # so checking the schema from there reads an empty database and reports
      # every upsert as broken. That cost three CI rounds to notice.
      - name: Every upsert has a unique index to conflict on
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/fresh_install
        run: npx tsx scripts/check-upsert-targets.ts

      - name: Running them again changes nothing
        # A migration that is not idempotent breaks the next deploy rather than
        # this one, which is the worst time to find out.
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/fresh_install
        run: |
          set -euo pipefail
          npm run migrate 2>&1 | tee replay.log
          if grep -q '\[migrate\] applied' replay.log; then
            echo "::error::A second run applied migrations again. The chain is not idempotent."
            exit 1
          fi

      - name: Run the database contract tests
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/instinct_test
        run: npx jest --testPathPatterns "\.db\.test\.ts$" --runInBand

      - name: Fail if the suite silently skipped
        # The failure mode this whole job exists to prevent is a check that
        # looks green while asserting nothing. If TEST_DATABASE_URL ever stops
        # reaching the tests they would all skip and the job would still pass,
        # which is exactly how the invite e2e sat dormant for months.
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/instinct_test
        run: |
          set -euo pipefail
          npx jest --testPathPatterns "\.db\.test\.ts$" --runInBand --json --outputFile=db-results.json >/dev/null 2>&1 || true
          PASSED=$(node -e "console.log(require('./db-results.json').numPassedTests)")
          echo "database-backed assertions that ran: $PASSED"
          if [ "$PASSED" -lt 1 ]; then
            echo "::error::No database-backed tests ran. They skip without TEST_DATABASE_URL, so this job was asserting nothing."
            exit 1
          fi
