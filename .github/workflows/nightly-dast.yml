name: Nightly DAST

on:
  schedule:
    - cron: '30 4 * * *'
  workflow_dispatch:
    inputs:
      target:
        description: 'Target URL (overrides PROD_URL secret)'
        required: false
        default: ''

jobs:
  dast:
    uses: the-wolfpack-agency/AgenticQA-core/.github/workflows/nightly-dast.yml@main
    with:
      prod_url: ${{ github.event.inputs.target || secrets.PROD_URL || 'https://wolfpack-apex.vercel.app' }}
    secrets: inherit
